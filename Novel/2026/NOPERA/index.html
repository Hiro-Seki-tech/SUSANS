<script id="nopera-public-project" type="application/json">{"format":"NOPERA_TEMP_PROJECT","formatVersion":3,"savedAt":"2026-10-17T16:47:58.289Z","manuscript":{"fullText":"第一部\t古の時代\n\n第一章\t神々の時代\n\n第一節\t序\n\n　はるか昔――まだ世界が今の姿を成すよりも前のこと。\n\n　すべての存在の源泉たる、“ウォル”と呼ばれる力があった。\n　そのウォルより、天界に三柱の神が生まれた。\n\n　ひとりは、あらゆるものを生み出す創造の神。\n　ひとりは、生み出されたものを壊す破壊の神。\n　そしてもうひとりは、その二つを調停し、世界の均衡を保つ神。\n\n　三柱の主神による創造と破壊と両者の調和。その果てしない営みの中から、やがて世界を形づくるさまざまな概念が生まれ、それらを司る神々が生まれ、さらには人間をはじめとする多くの生命が生み出されていった。\n\n　神々といえども、そこに在るだけで永遠に存在できるものではなかった。\n　その世界に生きる者たちから、“信仰”を得られぬ神は、やがて力を失い消滅し、深い信仰を集めた神は、その力を保ち続けることができた。\n　ゆえに神々が世界の住人たちに求めたものは、深く清らかな信仰であり、時にはその信仰をめぐって神と神が争うことさえあった。\n\n　――スサンス大陸。\n\n　人間を初めとする様々な生命が産み落とされた物質界に存在する、一つの大陸。\n　だが、その大地は初めからそこにあったわけではない。\n　太古の時代、“時”という概念を司る一柱の神を封じるため、その大陸は創られた。\n\n　その神の名は――スセオーンス。\n\n　そして、その神を封じた大地こそが、これから語られる物語の舞台となる、スサンス大陸である。\n\n\n\n第二節　アルヴァーダイン\n\n　神々の住まう天界。\n\n　そこに、二柱の若き神が呼び出されていた。\n　兄の名は、アポロン・ダイス。\n　妹の名は、アルテミシャ・ルーア。\n　ともに光と運命を司る、兄妹の神である。\n\n　二柱の前には、天井から床までを覆う、白いレースのカーテンが垂れていた。その向こうにいるのは、この世界の始まりから存在する三柱の主神――創造、破壊、そして調和を司る神々である。\n　だが、その姿は見えない。\n　天界に住む神々でさえ、三主神の姿を直接目にすることはほとんどなかった。アポロンとアルテミシャもまた、白いカーテンを隔て、その向こうから響く声を待っていた。\n\n　やがて、静寂の中に、穏やかな声が響いた。\n\n「これまで、たくさんのものを生み出してきました」\n　創造神アルヴァーダインの声だった。\n「あなたたちも。そして――あの子、スセオーンスも」\n　そこで、声が一度途切れた。\n\n「けれど、スセオーンスが司る力は、私たちの想像を超えるものでした。あの子はその力に溺れ、やがて天界のすべてを自らのものとしようとした」\n\n　白いカーテンは、微動だにしない。\n\n「私たちとて、“時”の力から逃れることはできなかったのです」\n　アポロンの視線が上がった。\n　隣に立つアルテミシャも、わずかに顔を動かす。\n\n「スセオーンスは、長い時をかけて、私たちに自らの時の力を及ぼしていました。ほんのわずかずつ……私たち自身にも気づかれぬほど、ゆっくりと――“時の呪い”とでも、呼ぶべきでしょうか」\n　再び、沈黙が訪れた。\n\n「私たちが気づいた時には、すでに――」\n　言葉が止まる。\n　やがて、その静寂を破るように、アルヴァーダインの声が続いた。\n「スセオーンスは私たちを退け、天界の王となろうとしています。けれど、今の私たちには、もうあの子の力に抗う力はありません」\n　アポロンとアルテミシャは、黙ったまま白いカーテンを見つめていた。\n\n「だから、あなたたちを呼んだのです」\n　その時だった。\n　白いレースが、かすかに揺れ、その中央に細い隙間が生まれる。\n　そこから、一本の手がゆっくりと差し出された。\n\n　アポロンの視線が、その手に止まった。アルテミシャも動かなかった。\n　二柱は、その手を知っていた。\n　かつて目にした創造神アルヴァーダインの手は、白く、若々しく、生命力に満ちていた。\n　万物を生み出した、すべての母。生命力の源である創造神アルヴァーダイン。\n\n　だが、二柱の前に差し出されたその手は、永い年月を生きた人間の老女のもののように、細く、深く皺んでいた。\n　そして、その手の上には一本の剣があった。\n　青白い光が、脈打つように刀身を走っている。\n\n　白いカーテンの向こうから、アルヴァーダインの声がした。\n\n「この剣には、私に残された力を託しました」\n　アポロンの視線が、老いた手から剣へと移る。\n「神の力に抗えるのは、神の力だけ。これは、私に代わってその力を振るう剣です」\n\n　わずかな沈黙があった。\n\n「この私の代わりの剣で――」\n　再び、声が途切れる。\n「スセオーンスを、斬りなさい」\n\n　アポロンが剣へ手を伸ばす。\n　だが、その指先は一度、止まった。\n　視線が、剣から、それを支える皺深い手へと移り――やがてアポロンは両手で、青白く輝く剣を受け取った。\n\n「サー・アルヴァーディ……」\n\n　小さな声が、白い空間に響いた。\n　神々の言葉で――**アルヴァーダインの代理**\n\n　剣がアポロンの手へ渡ると、皺深い手はゆっくりと白いレースの向こうへ消えていき、再びカーテンが閉じた。\n　その向こうからは、もう何も聞こえなかった。\n\n\n\n第三節　スセオーンス\n\n　三柱の主神のもとに、光と運命を司る兄妹神、アポロン・ダイスとアルテミシャ・ルーアが再び姿を現した。二柱の姿には、先ほどまで続いていた戦いの激しさが刻まれていた。\n　中でもアポロンの変貌は著しく、若々しかったその顔には深い皺が生まれ、髪にも時の流れが刻まれている。先ほどまで青年の姿をしていた神が、今は壮年の男のように見えた。一方で、その隣に立つアルテミシャには、兄ほどの変化は見られない。兄が妹を庇ったであろうことは明らかだった。\n　神々とて、永遠の存在ではない。\n　スセオーンスの“時の呪い”は、確かに兄のアポロンの身に及んでいた。\n\n「スセオーンスを滅ぼすことは、できなかったようだな」\n　白いカーテンの向こうから、低い声が響いた。\n　アポロンは答えなかった。\n　その手には、青白い光を宿した剣――サー・アルヴァーディが握られている。\n「その剣があれば、あの子を斬ることができたはずです」\n　今度は、アルヴァーダインの声だった。\n　兄妹は黙ったまま、顔を伏せた。\n　しばらくの沈黙の後、アポロンが口を開いた。\n「スセオーンスは天界を離れ、物質界へ逃れました」\n「ならば、追わねばならぬ」\n　間を置かず、先ほどの低い声が答えた。\n「奴を生かしておけば、いずれ物質界の者たちから信仰を集め、再び力を取り戻す。そして同じことを繰り返すだろう」\n　別の声が、静かに続いた。\n「まして物質界で、自らに適した“器”を得ることになれば……容易には止められなくなるでしょう」\n　アポロンは何も答えず、アルテミシャも、兄の隣で黙っている。\n「なぜ、斬らなかった」\n　低い声が再び問うた。\n　アポロンの手が、わずかに動いた。\n　握られたサー・アルヴァーディに青白い光が走り、アポロンの視線がその剣へ落ちた。\n「この剣は……母なるアルヴァーダインの力を託されたもの」\n　それだけを言って、アポロンは言葉を止めた。\n　白いカーテンの向こうから返事はない。\n「それに――」\n　アポロンが顔を上げる。\n「スセオーンスを消し去れば、 “時の呪い”を解く術も、永遠に失われるかもしれません」\n　沈黙。\n　アポロンの視線が白いレースへ向けられたが、主神達は何も答えなかった。そして、その向こうから、先ほど見た皺深い手が再び現れることもなかった。\n\n「私たちが物質界に行きます」\n　沈黙を破ったのは、アポロンだった。\n「スセオーンスが器を得る前に追いつき、物質界の地に封じます」\n　隣に立つアルテミシャが、静かに兄を見て、アポロンと同じように白いカーテンへ向き直った。\n「二度と、あの力を振るうことができぬように」\n　しばらく、誰も言葉を発しなかった。\n\n　やがて白いカーテンの向こうから、声がした。\n「……行きなさい」\n　アルヴァーダインの声だった。\n　\n＊\n\n　物質界。\n　人間をはじめ、多くの生命が暮らす世界。そこに生きる者たちの信仰は、神々に力を与える源でもあった。\n　天界を追われ、力を失ったスセオーンスがここを目指したのも、この世界における信仰を集め、失った力を取り戻すためだった。\n　そして、そこにはまだ、“スサンス”という名の大陸は存在していなかった。\n\n　青く澄みきった空に、小さな黒い穴が現れた。\n　初めは点にしか見えなかったその穴は、ゆっくりと広がっていき、やがてはその奥から、青い光を帯びた煙がシュウ、シュウ――漏れ始める。\n　低い音とともに吐き出される煙は止むことなく広がり、澄みきっていた青空を覆っていった。\n　風が荒れ、海面が波打ち、やがて巨大な波がぶつかり合う。\n　空と海が荒れ狂う中、黒い穴はなおも広がり続けた。\n\n　数日が過ぎた。\n　そしてついに、穴の奥から一つの巨大な球体が姿を現した。\n　闇のように黒い球体。その表面を、弱々しい青い光が覆っている。\n　時を司る神――スセオーンス。\n\n　天界での戦いによって、既にその力は大きく失われていた。そして、神々が物質界に存在し続けるためには、自らに適したこの世界の“器”を見つけなければならなかった。\n　青い光をまとった黒い球体は、荒れ狂う空をゆっくりと進んでいく――自らの器を見つけて、信仰により再び力を取り戻すために。\n\n　だが、間もなく、その背後にある黒い穴が再び輝き、二つの光が飛び出した。\n　アポロン・ダイスとアルテミシャ・ルーア――スセオーンスがこの世界で自らの器を得る前に、兄妹は追いついたのだ。\n　\n　三つの光が、荒れ狂う空で交錯し、再び神々の戦いが始まった。\n　三柱の力がぶつかるたび、空が震え、海が割れ、青い閃光が世界を照らした。\n　しかし、スセオーンスには、既にかつての力は残されておらず、その戦いは天界で繰り広げられた死闘のように長くは続かなかった。\n　兄妹は逃げるスセオーンスを追い詰め、やがて、黒い球体を覆っていた青い光が消えた。残されたのは、光を失った暗黒の球体だけだった。\n\n　アポロンとアルテミシャは、その球体を海へと押し込んだ。海が裂け、海底の大地が轟音とともに割れて、深い亀裂の底へ、スセオーンスが沈んでいく。\n　二柱の光が、その亀裂の上で重なると、海底が隆起し、巨大な岩盤がスセオーンスを覆っていく――こうして、スセオーンスは物質界の地の底深くへと封じられた。\n\n　すべてが終わった後、荒れ狂っていた海は、やがて静けさを取り戻した。\n　だが、そこには以前には存在しなかったものがあった。\n　広大な海のただ中に、一つの巨大な大陸が生まれていた。地の底に眠る時の神が、再び世界へ現れることのないように創られた巨大な封印。\n　いわば、大陸そのものが“封印の扉”であった。\n\n　長い時が流れた。\n　やがてその大陸には人々が暮らすようになり、国が生まれ、数えきれないほどの物語が紡がれていくことになる。\n　そしていつしか人々は、地の底に封じられた神――スセオーンスの名に因んで、その大陸をこう呼ぶようになった。\n　“スサンス”大陸。\n　こうして、この物語の舞台が創造された。\n\n\n\n第二章\t英雄たちの時代\n\n【この章の登場人物】\n\nヴィルガンディリア：\n水晶の森に暮らす長命の男。豊富な知識と経験を持ち、セイヴァードと出会ったことで、その運命を大きく変えていく。\n\n\nセイヴァード・カーン（先帝）：\n当時大陸を跋扈していたエル・ジーザス教の勢力を打ち破り、初めて大陸を統一した人間の戦士。\n\nアルヴァード・ソーシャ：\nセイヴァードの娘。紅の戦士と呼ばれる剣の達人。\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n第一節　ヴィルガンディリア\n\n　時の神スセオーンスを封印するための神々の戦いから、何千年、何万年の時が経過した。そして、これは今より１０００年程前のことである。\n\n　大陸の中央には、古くから“水晶の森”と呼ばれる広大な森があった。\n　朝の光が木々の隙間から差し込むと、森はその名の通り、無数の水晶を散りばめたように輝いた。だが、輝いているのは水晶ではなく、木々の枝に実った、透き通るような果実だった。\n　薄い青や緑を帯びたその実は、陽光を受けるたび、森の奥深くまで淡い光を返す。鳥たちがそれを啄み、小さな獣たちが落ちた実を拾う……森に暮らす者たちにとって、それは珍しいものでも神秘的なものでもない、いつもの光景だった。\n\n　この水晶の森には、“クリスタル・エルフ”と呼ばれる者たちが暮らしていた。\n　エルフと呼ばれる者たちは、姿こそ人間とよく似ているが、人間よりもはるかに長い時を生きる種族であり、人間のように大きな集落を築いて群れるより、森や山、湖といった自然の中に居場所を見つけ、その土地とともに静かに生きる者たちだった。\n　この不思議な森の魅力に惹かれ、血筋も、生まれた土地も一様ではない、大陸の内外からやって来た多様なエルフたちが、長い年月をかけてここに根を下ろした。いつしか人々は、森の名になぞらえて、彼らをまとめてクリスタル・エルフと呼ぶようになった。　　\n\n　そんなクリスタル・エルフ達の間で、“不老の男（ラーク）”という愛称で呼ばれていた一人の男が森の中を歩いていた。\n　ヴィルガンディリア\n　長い金色の髪の間から、わずかに尖った耳が覗いている。見た目だけなら、まだ若い青年のようだったが、彼はすでに１００年以上の時をこの森で過ごしてきた、クリスタル・エルフ達の中でも最古参といえるほどの古株だった。彼自身、自分が正確に何歳なのかは覚えていなかったし、幼い頃の記憶もほとんどなく、自分の身体にどのような血が流れているのかも知らなかった。\n　ただ、彼の金髪のところどころには黒髪が混じり、時折その顎に薄い無精髭が浮かぶことがあった。どうやら、エルフだけではない人間等の他の種族の血が混じっていることは感じていたが、ヴィルガンディリアにはあまり興味がないことだった。　\n　　自分が何者なのか。\n　　あと何年生きるのか。\n　そんなことを考えるより、彼はただ、この森で静かに生きていければ、それでよかった。風が木々を抜ける音、水晶の果実が朝日に輝く光景、夜になると聞こえてくる小さな生き物たちの声、そういうものを日々感じられればそれでよかった。\n\n「ラーク？」\n　不意に後ろから声がした。\n　振り返ると、昔から見知った一人の男――ヴィルガンディリアよりもずっと歳老いて見えるが、実際には、彼と同い年程のはずの男が立っていた。\n「今夜は来るのだろう？」\n「……何に？」\n「今日は、うちで食事をすると言っただろう、忘れたのか」\n　ヴィルガンディリアはしばらく黙っていた。\n「……すまないが、今日は遠慮させてもらう」\n「今日“も”…だろう、ラーク。お前はいつまでも見た目は変わらないが、中身は随分と変わってしまったな」\n　ヴィルガンディリアは、ため息交じりにそうつぶやく友人の顔を見た。いつからだろう、この男はいつの間にかこんなにも老いてしまった。\n「気が向いたら来い、皆がお前に会いたがっている」\nそう言い残して、彼は去っていった。\n「あぁ、約束を忘れてしまって悪かったな……」\n　ヴィルガンディリアは、その背中をしばらく見送っていた。\n　\n　長く生きるということは、多くのものと出会うということだったが、同時にその出会った多くのものと別れるということでもあった。ラーク、すなわち不老の男という異名を持つヴィルガンディリアはこれまでに、何人もの仲間を見送ってきた。それは人間よりはるかに長命な、この森のエルフたちが相手であっても変わりはしなかった。\n　出会い、共に過ごし、親しくなる、そして周りはいつか自分を追い越して老いてゆき、自分だけを残していなくなる。何かを、誰かを、深く愛すれば愛するほど、その別れは彼にとっての耐え難い痛みとなった。\n　そんな経験を幾度となく繰り返していくうちに、ヴィルガンディリアは、その痛みから逃れるように、仲間たちと少しずつ距離を置くようになっていた。\n\n　＊\n\n　ある日、１００年以上続いたヴィルガンディリアの水晶の森における静かな暮らしは、ある侵略者たちによって、突然終わりを告げた。\n　森に悲鳴が響くと共に、鳥たちが一斉に飛び立ち、木々の向こうから黒い煙が上がった。\n\n　水晶の森の侵略者は、時の神スセオーンスを信奉する者たち――“エル・ジーザス”だった。彼らは人間を中心に、さまざまな種族の者たちが入り交じった集団であり、その目的はただ一つ、この地に封じられたとされる伝説の時の神スセオーンスを復活させ、その時の力によって永遠の命を得ること、であった。\n　スサンス大陸の歴史において、彼らエル・ジーザスは幾度となく出現し、そのたびに各地の平穏を脅かしてきた。\n\n　そのエル・ジーザスの一群に、水晶の森が狙われたのだ。\n「西へ行け！」\n　ヴィルガンディリアは仲間たちに叫んだ。　\n「森の奥へ！　ここには戻るな！」\n　弓を手に、彼は一人、仲間たちとは逆の方向へ走った。\n　長く森で暮らしてきたヴィルガンディリアは、まともな“戦い”というものをほとんど知らなかったが、森のことは誰よりも知っていた。獣の通り道、足を踏み入れれば沈む地面、蔦に隠れた窪地、どの枝が人の重みに耐え、どの枝が簡単に折れるかも、誰よりも知っていた。彼にとって森そのものが武器だった。\n　仕掛けた罠に侵入者が落ちる、木々の間を矢が走る、姿を見せては消え、追わせては別の道へ誘い込む――ヴィルガンディリアは、侵入者たちを森の中心から少しずつ遠ざけていった。\n　\n　だが、敵の数が多すぎた。\n　一人倒しても、その後ろから二人が来るうえ、その向こうからもさらなる足音が聞こえてくる。\n　やがては彼の罠も矢も尽きた。\n　ヴィルガンディリアは弓を捨て、傷を負った手で腰の剣を抜いたが、もう既に息が上がっていた。\n　――ここまでか。\n　死ぬことそのものは怖くなかった。\n　もう、十分に長く生きたと思う……。それよりも、自分が倒れた後、この侵略者たちが森の奥へ向かうことのほうが気になり、彼はもう一度、剣を握り直した。\n　そのときだった。\n「伏せろ！」\n　聞き慣れない人間の言葉が飛んできた。\n　意味を考えるより先に、何者たちかがヴィルガンディリアの横を駆け抜けた。その者たちの先頭に立つ黒髪の青年の剣が、ヴィルガンディリアへ迫っていた男の武器を弾き飛ばした。\n「大丈夫か！」\n　黙っていたヴィルガンディリアに、今度は青年が困った顔をした。\n「……言葉、通じてないのか？」\n「いや、分かる」\n「なんだ、よかった！　俺たちはエル・ジーザスじゃない、味方だぞ」　\n　こんな状況だというのに、青年は笑った。\n「話は後だ、まだ来るぞ」\n　二人は、互いを背にして同時に剣を構えた。\n　初めて会った人間であり、名も知らないし、彼が何をしにこの水晶の森に入って来たのかも分からない…それなのに、不思議と背後を気にする必要がないように思えた。\n\n　戦いが終わった頃には、森の向こうから朝の光が差し始めていた。\n　青年は屈託のない笑顔でヴィルガンディリアに手を伸ばし、自分のことを指差した。\n「俺は“セイヴァード”という。奴らを追っていたら、こんな森の中にまで来てしまった」\n　彼は、他の仲間たちと共に、人間の世界を襲ったエル・ジーザスを討伐するため、この水晶の森の辺境にまでやって来ていたのだった。ヴィルガンディリアは彼らたちと共闘することで、エル・ジーザスを水晶の森から退けることに成功した。そしてエル・ジーザスの討伐軍を率いるこの人間の青年こそが、今からおよそ２０年の後に、このスサンス大陸で初めて人間の王国を定立する、先帝セイヴァード・カーンその人であった。\n　青年は、今度はヴィルガンディリアを指さした。\n「おまえの名は？」\n「……ヴィルガンディリア、この森では、皆に“ラーク”と呼ばれている」\n「ヴィルガン……ラーク…」\n　人間である彼にエルフの言葉はうまく聞き取れないようだった。\n　ヴィルガンディリアが眉をひそめると、その青年はまた笑った。見た目でいえば、その青年はヴィルガンディリアとあまり歳が離れていないように見えた。しかし、人間の寿命を考えれば、彼はずっとずっと若い……自分にとっては幼子のような者のはずだった。だが、長い間仲間たちから距離を置き、独りで生きてきた自分は、何者かとの接触に飢えていたのかもしれない。ヴィルガンディリアは、セイヴァード達と共にいることで、自分の内面が満たされていくのを感じた。\n　また、もしかしたら自分の身体にもその血が流れているかもしれない人間という種族と初めて接触することに、なんとも言いえない好奇心が湧くのを感じていた。自分にとっては無限とも思えるような“時間”……その時間という資源に限界があることを意識して行動する人間達の姿は、ゆっくりとした時間の中で生きてきたヴィルガンディリアにとってはとても新鮮なものに映った。\n\n　１００年もの間、水晶の森を出たことがなかったヴィルガンディリアは、いつの間にか、セイヴァードと共に旅をするようになった。\n　最初は、水晶の森の周辺からエル・ジーザスを追い払うまでのつもりだった。だが、次の土地まで…次の戦いまで…と繰り返しているうちに、１００年以上出たことのなかった水晶の森はいつの間にか遠くなっていた。\n　彼は、セイヴァードと行動を共にすることで、初めて外の世界を知った。長寿のエルフ族が住み、悠久の時間が流れている水晶の森より、とても刺激的で変化に富むこの外の世界を知った。ヴィルガンディリアは、己の中の止まっていた時が、静かに動き出したように感じた。\n\n　＊\n\n　人間達を率いて平和な世を求めていたセイヴァードも、ヴィルガンディリアの才能と豊富な経験・知識を頼りにしていた。森の中で出会ったその金髪の青年は、もしかしたら自分よりも年若いかもしれないのに、この大陸のいろいろなことを知っている。土地を知り、植物を知り、動物を知り、人間が知らない古い伝承を知り、時には人間とは異なる言葉を話す者たちとの橋渡しにもなった。剣の腕前も弓の腕前も、自分が知り得る優秀な戦士たちに劣らない。最初は、ヴィルガンディリアの話すエルフの言葉がよくわからなかったが、すぐに人間の言葉を流暢に話してくれるようになった。\n　いつの間にか、セイヴァードの背後には常にヴィルガンディリアがおり、時には共に剣を振るい、時には世界に平和を導くために、夜通し意見を交わし合った。ヴィルガンディリアは、自ら表に立つことを望まなかったし、歴史に名を残したいなどとは微塵も思わなかったが、彼こそが、セイヴァードの建国を支えた第一の英雄であることを、セイヴァードと共に戦った者たちは皆よく知っていた。\n\n　そして幾多の戦い――その多くは各地に跋扈するエル・ジーザスとの戦いであった――を経て、ついにセイヴァード・カーンは、スサンス大陸で初めてとなる人間の王国を築き上げた。２６歳でヴィルガンディリアと出会ったセイヴァードは、２２年の戦いを経て、既に４８歳になっていた。\n　これが、大陸歴０年、いまからおよそ１０００年前の出来事である。　\n　\n　後の世、人々は、セイヴァード・カーンを建国の英雄、先帝などと呼んだが、その英雄の傍らには、いつももう一人の英雄がいたことを、今では誰も覚えていない。\n　ヴィルガンディリア\n　ただ、水晶の森で長いあいだ止まっていた彼の時は、確かに動き始めていた。\n\n\nSUSANS Continental Era — Year −22\n\n\n\n\n\n\n第二節　セイヴァード\n \n大陸暦０年――人間の王国アクトマイス、初代の王“セイヴァード・カーン”、大陸に跋扈していたエル・ジーザス教――時の神“スセオーンス”を信奉する者たち――を駆逐し、初めて大陸に人間の国を興す。\n\n\n　セイヴァードが、水晶の森で不老の男、ヴィルガンディリアと出会ってから、既に２０年ほどの時が経過してきた。\n　二人の戦いはエル・ジーザスとのものが主であったが、人間の国を築くためには、それだけでは足りなかった。各地に巣食うモンスターの討伐、異種族との調停、人間同士の争いの裁定――やらなければならないことは、いくらでもあった。\n　ヴィルガンディリアは、初めて森で出会ったときから変わらず、常にセイヴァードの背後を守り、彼の知らない多くの知恵を授けてくれた。特に南の山地に住む竜族の王との交渉は、ヴィルガンディリアがいなければ何一つ進まなかっただろう。なにより彼は、野心も欲望も見せることなく、ただセイヴァードの傍らに立ち、彼の成そうとすることを支え続けた。\n　彼と出会わなかったら、この偉業は到底なし得なかったに違いない。\n  ヴィルガンディリア――人間たちは、いつしか彼を“ビルガン・デュラク”と呼ぶようになっていた。もとはといえば、出会ったばかりの頃、セイヴァードが彼のエルフ語をうまく聞き取れなかったことから生まれた名だった。ヴィルガンディリアはあえて訂正しようとはせず、むしろセイヴァードがつけたその呼び名を、いつしか好んで受け入れるようになっていた。\n　そして人間の国が興ったあとも、ビルガンは水晶の森へ帰らなかった。\n　国を建てたとはいっても、エル・ジーザスはなお各地に残っており、まだ平和が訪れたとはいえない。セイヴァードは頼りになる仲間として、ビルガンにこの国へ残っていてほしかった。だが、それ以上に――２０年という歳月を共に過ごした彼を、もはや家族のように感じていた。離れたくなかったのだ。\nセイヴァードはすでに四十八歳になっており、建国の三年ほど前には一人の娘を授かっていた。それでも、多忙な日々を送る彼の傍らに最も長くいたのは、本当の家族よりも、むしろビルガンの方だった。\n\n　＊\n\n　５０歳をいくつか過ぎた頃、セイヴァードは、恐る恐る尋ねた。\n「ビルガン……いつまでここにいてくれるんだ？」\n　水晶の森で出会ってから、すでに２５年以上が経っている。それでも、ビルガンの姿はあの頃とほとんど変わっていなかった。長命なエルフたちからさえ“不老の男”と呼ばれているのだから、それも当然なのかもしれない。それでも実際に目の当たりにすると、やはり奇妙なものだった。\n　対して、セイヴァードの目尻には年齢相応の皺が刻まれ始め、髪にも白いものが混じるようになっていた。\n（やれやれ……いつの間にか、こちらの方が先に歳をとってしまったようだ……）\n　そもそもヴィルガンディリアの本当の年齢など知らないのだから、どれほど時が経ったところで二人の年齢が逆転するはずもない。それでも、少なくとも見た目だけなら、そう思わずにはいられなかった。セイヴァードは、ビルガンの目に今の自分がどう映っているのかを思い、内心でため息をついた。\n「そろそろ森に帰ったらどうか、という私への提案か？」\n　珍しく不安げな顔をして、神妙に尋ねてくるセイヴァードの不安を見透かしたのか、目の前の若い友人は冗談めかして言った。\n「確かに、エル・ジーザスはおおよそ壊滅させた。でも、戦乱の火種はいまだ各地に残っている。まだおまえの力が必要なんだよ、出て行かれたら困るな」\n　真面目な顔をして期待していた言葉を返したセイヴァードに、ヴィルガンは微笑んだ。\n「君が望んでくれる限り、私はいつまでもここにいるつもりだ」\n　その言葉を聞いて、セイヴァードの表情がようやく明るくなった。\n「ならば、いつまでもいて欲しい。幸い――」\n　セイヴァードはふと振り向いた。その先では、幼い娘が静かに眠っていた。\n「幸い――娘も、お前によく懐いている」\n　ヴィルガンディリアもまた、眠る幼子へ優しげな銀色の眼差しを向けた。\n　そこにはもう、水晶の森で孤独に時を過ごしていた、かつての男はいなかった。\n\n　＊\n\n　ヴィルガンディリアは、セイヴァードに告げた言葉通り、王国建立後も彼を補佐し、時には各地の戦乱を鎮めるため、軍を率いてセイヴァードと共に遠征した。\n　やがて戦乱が収まってくるにつれ、彼の役割は、セイヴァードの娘――創造神アルヴァーダインに因んで名づけられたアルヴァード・ソーシャを育てることへと、少しずつ比重を移していった。剣、弓、馬術、地理、歴史、言語、天文……ヴィルガンは、自らの知るあらゆることを彼女に教えた。\n　そして、アルヴァードが十分に剣を振るえる年齢になると、ヴィルガンは彼女を戦場へ伴い、ときには自らに代わって兵を指揮させることさえあった。父セイヴァードから戦士としての才を受け継いだ彼女は、戦うことにも、人を率いることにも、早くから並外れた素質を見せていた。\n\n　王国建立から１０年あまりが経ち、セイヴァードも６０歳に近づく頃には、自ら剣を振るう機会も少なくなり、国政に携わる時間の方が長くなっていた。代わって戦場へ赴くようになったのは、主にビルガンと、成長したアルヴァードだった。まだ１０代半ばでありながら、アルヴァードはすでに戦場で目覚ましい働きを見せており、その姿に、セイヴァードはかつての自分を重ねることもあった。\n　深紅の鎧をまとい、美しい黒髪を靡かせながら勇猛果敢に戦うその姿を、兵士たちはいつしか勝利の女神のように仰ぐようになった。そして、ヴィルガンが守る背中もまた、いつしかセイヴァードのものから、その紅の戦士アルヴァードのものへと変わっていた。\n\n\n　＊\n\n　セイヴァードがビルガンと出会った頃、ともに水晶の森で戦った仲間たちも、３０年以上の時を経て、一人、また一人とこの世を去っていった。王国の中にも、建国に至るまでヴィルガンがどれほど大きな役割を果たしたのかを知らない者が、いつしか増えていた。\n　臣下たちの中には、歳月を経ても一向に老いることなく、武にも知にも秀でたこの男を危険視し、王国から遠ざけるようセイヴァードに進言する者さえ現れた。だが、セイヴァードはそのような言葉には一切耳を貸さなかった。\n　一方で、ビルガン自身も周囲の変化には気づいているようだった。以前にも増して人前に出ることを避け、王宮でも目立たぬよう、慎重に振る舞うことが多くなっていた。\n\n　そんなある日、セイヴァードは人目を避けるように、ビルガンを自室へ呼び出した。久しぶりに二人きりで向き合った友の表情からは、かつての明るさが失われているように感じられた。 \n（ここでの暮らしは、もうこの男には窮屈すぎるのかもしれない……このままでは、いずれ自分のもとからいなくなってしまうかもしれない）\n　セイヴァードはしばらく言葉を探したあと、静かに切り出した。\n「この大陸は広い。一つの国だけで、俺一人が護っていくのには限界がある。だから、いずれはいくつかの国に分け、それぞれの王に統治を任せるのはどうだろうか？」\n　ビルガンの表情からその反応をうかがいながら続けた。\n「そして、その国の一つを、お前に任せたい。」\n　唐突な提案に、ビルガンはすぐには答えなかった。\n「私は、そんなことは望んでいない……君なら、よく分かっていると思うが」\n　やがてビルガンは、セイヴァードの顔をまっすぐに見つめた。その視線が、自分の顔に刻まれた深い皺や、半分以上が白くなった髪に注がれているような気がした。出会った頃にはほとんど同じだった背丈も、今では自分の方がわずかに小さくなっている。\n「歳をとったのだな……セイヴァード」\n「あれから３０年以上経った……仕方のないことだ。人間である俺にとって、３０年という時間はとても長い」\n　セイヴァードはビルガンの視線から逃れるように顔をそむけた。\n「もう俺も、自分の終わりを見ながら行動しないといけない。安心して後を託せるのは、おまえしかいない」\n　ビルガンはただ黙っていた。\n「子供たちはまだ未熟すぎる。おまえしか――」\n「国を分けるのは、よい考えだと思う」\n　ビルガンがその言葉を遮った。\n「王たちの王となり、ここからそれぞれの国を束ねるのがいいだろう。だが――当然だが、私に人間の国の王などできない」\n　そして、少し間を置いて続けた。\n「それに、アルには……アルヴァードには、私のすべてを教えた。いずれ、この国を背負うに相応しい人間になるはずだ」\n「では、俺の代わりにアルヴァードを支えてやってくれないか」\n　セイヴァードは嘆願するようにビルガンを見つめた。かつて戦場で響き渡った声も、今では少しかすれていた。\n「アルヴァードを……？」\n　セイヴァードはうなずいた。\n「娘が生まれた時から、おまえはずっと一緒だった……おまえがこれからも傍にいてくれれば、いずれこの国を背負うに相応しい女王になるだろう……そして俺は……いずれ……」\n　そのとき、セイヴァードには、自分を見つめるビルガンの表情が一瞬だけ苦痛に歪んだように見えた。\n　ビルガンはそれ以上、何も言わなかった。\n　そして、そのまま部屋を出ていった。\n\n　そして、セイヴァードが恐れていた予感は、現実となった。\n　そのしばらく後、ビルガン・デュラクはセイヴァードの国から姿を消した。何も言わず、何も残すことなく。\n　大陸暦１７年――セイヴァードが国を興してから１７年。セイヴァードは６５歳、アルヴァードは２０歳になっていた。\n　\n　＊\n \n　老いたるセイヴァード帝の前に、輝く光をまとった一組の男女が現れた。\n　セイヴァードは、その二人を知っていた。若かりし頃――水晶の森でヴィルガンディリアと出会うよりも、さらに昔――彼らと一度、会ったことがあった。\n　数年前から、再びエル・ジーザスたちが勢いを盛り返していることは、各地から届く報告によってセイヴァードも知っていた。\n\n「スセオーンスが、この世界で宿るための器を見つけ、実体を得ようとしています。彼がこの世界に降り立てば、時に支配されるマテリアル・プレーン――物質界の住民であるあなた達に、勝ち目はありません」\n　最初に口を開いたのは、若い女の方だった。まとった光に遮られてその顔まではよく見えなかったが、セイヴァードはその声を覚えていた。\n　アルテミシャ・ルーア――光と運命を司る女神。\n「おまえのよく知る男、ビルガン・デュラクを器として……」\n　今度は男が告げた。その声にも覚えがあった。アポロン・ダイス――アルテミシャと同じく、光と運命を司る神。\n　ビルガン・デュラク。\n　その名を聞いた瞬間、セイヴァードは驚愕のあまり意識が遠のくのを感じた。\n　何十年も――自分の一生のほとんどをかけて、共にエル・ジーザスと戦ってきた盟友。その男が、なぜ今になって敵であるエル・ジーザスと関わっているのか。ましてや、スセオーンスの器になるとは、いったいどういうことなのか。\n　何一つ、理解できなかった。\n\n「スセオーンスの意思をその身に宿し、時の力を操ろうとしている彼を止めるには、お前はやや老いすぎました。お前の子の身体を借り、我らの力をもってスセオーンスを封じます」\n「子……？」\n　そう問い返しながらも、彼らのいう“子”が誰を指しているのか、セイヴァードには分かっていた。しかし――受け入れることはできなかった。\n　アポロン・ダイスが、ゆっくりとうなずいた。\n「すべての母、アルヴァーダインの御名を授かった、お前の娘だ」\n　老いたセイヴァード帝の顔が暗く歪んだ。\n「あの子に、その使命はあまりにも過酷だ……あの子は、ビルガン・デュラクを慕っている。父として、師として……そして男として」\n　自分の人生の大半を支え続けてくれた親愛なる友と、その友を愛する娘。その二人が殺し合うことになるなど、セイヴァードにはあまりにも辛いことだった。\n\n　そんなセイヴァードに、女神は優しく語りかけた。\n「あの子なら大丈夫。己の使命を全うするでしょう」\n「さあ、おまえがかつてエル・ジーザスを退けるため、アルヴァーダインより授かった神剣サルヴァドゥを、娘に渡すのだ。神の力を宿した肉体は、神の剣でなければ斬ることはできぬ」\n　アポロン・ダイスが視線を向けた。\n　玉座の後ろには、一振りの剣が鞘に収められたまま飾られていた。かつて幾度となくセイヴァードと共に戦場を駆けたその剣も、すでに何年ものあいだ抜かれてはいない。\n　そのとき、剣がひとりでに鞘から抜けた。\n　セイヴァードは目を見開いた。神剣サー・アルヴァーディの刀身が、青白い光を放っていた。長くこの剣を振るってきたセイヴァードでさえ、その光を見るのは初めてだった。\n　アポロン・ダイスが、クイっとわずかに手招きした。青白く輝く神剣は宙を舞い、回転しながらセイヴァードの前へ飛来すると、二柱の神と老王を隔てるように床へ深々と突き立った。\n\n「かつてアルヴァーダインと交わしたおまえの血の盟約は、おまえの娘にも引き継がれる。その剣を娘に託し、スセオーンスを封じよ。奴が完全にこの世界へ降り立つ前に」\n　\n　セイヴァードは、目の前の床に突き立ったサー・アルヴァーディを見つめていた。若かりしとき神々より託されたこの剣を、今度は、娘に渡さなければならない。 \n　青白い光が、老いたセイヴァードの顔を静かに照らしていた。\n\n\nSUSANS Continental Era Year 17\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n第三節　アルヴァード\n \n　大陸暦１７年。\n　アルヴァードは、自室に閉じこもったまま、もう何日も姿を見せていなかった。\n　ある日、ビルガン・デュラクが突然、彼女の前から姿を消してしまったのだ。\n　ビルガンは、アルヴァードが生まれたときから、ずっとそばにいた。幼い頃に母を亡くし、英雄王として多忙な父とも過ごす時間が限られていた彼女にとって、ビルガンは誰よりも身近な存在であり、自分を育て、導いてくれた師でもあった。\n　そして、老いていく父とは対照的に、ビルガンはいつまでも若々しく、美しい男だった。長い金髪にはところどころ黒髪が混じり、それが自分の髪と似ていることを、アルヴァードは密かに嬉しく思っていた。どんなときでも冷静で、長い年月を生き、数多くのものを見てきたかのような叡智をたたえた銀色の瞳。王の娘として多くの人々に囲まれて育ったアルヴァードにとっても、彼は特別な存在だった。だが、そんな思いを表に出すことはなく、彼の教えに従う従順な生徒として振る舞ってきた。\n　そんなビルガンが自分に向ける眼差しは、いつも優しかった。娘に向けるような、妹に向けるような、あるいは親しい友人に向けるような……その温かな眼差しの中に、アルヴァードは自分がどのような存在として映っているのか、答えを見つけられずにいた。\n　アルヴァードが２０歳を迎えようとしていた、そんな矢先のことだった。何の前触れもなくビルガンが姿を消し、彼女の日常は一変した。自分が何か気に障ることを言ったのだろうか。それとも、知らず知らずのうちに彼を傷つけてしまったのだろうか。何度も過去の言葉や出来事を思い返し、自分を責めた。だが、どれほど考えても、その理由は見つからなかった。\n\n　だが、いつまでも部屋に閉じこもっているわけにはいかなかった。父は確実に老い、母の異なる弟はまだ幼い。父が築き上げたこの王国を、これからは自分が護っていかなければならない。そのことは、誰よりもアルヴァード自身がよくわかっていた。\n　\n　いつか必ず、戻ってくる。\n\n　その願いを胸に、アルヴァードは前に進むことを決意し、彼女を象徴する紅の鎧をまとい、静かに扉を開けた。いつまでも、悲しんではいられないのだ。\n　だが、１年待っても２年待っても――５年の歳月が過ぎても、ビルガン・デュラクが王国に戻ることはなかった。あれほど長い間そばにいたのに、感謝の言葉さえ、そして何より、自分の本当の気持ちを伝えることができなかった。次に会えたなら、必ず……。彼女はビルガンがいつか戻ってくると信じていた。いや、信じるしかなかった。\n\n　その間にも、王国を脅かすエル・ジーザスの残党たちの動きは活発になり、アルヴァードは彼らとの戦いのために大陸中を駆け回っていた。剣を振るい、戦場を駆け抜けている間だけは、何も考えずに済んだ。むしろ、そうしている方が気が晴れた。\n\n　英雄王セイヴァードの血を引き、ビルガン・デュラクに師事してきた紅の戦士アルヴァードもまた、他に類を見ない稀代の勇者へと成長していた。かつて父がそうであったように、彼女は自ら剣を取り、戦場の先頭に立ち続けた。人々はそんな彼女を、英雄王の娘としてだけではなく、一人の英雄として敬い、慕うようになっていた。\n　\n＊\n\n　大陸歴２２年、すなわちセイヴァードがこの大陸に国を建ててから２２年が経過していた。\n　この５年間で、セイヴァードはかつてビルガンに語った統治の構想を実現させていた。広大な大陸を３つの王国に分け、それぞれに王を置き、その上に立つ皇帝が全体を統治するという帝国の仕組みである。３人の王には、長年苦楽を共にしてきた信頼のおける仲間たちを選んだ。こうしてセイヴァードは帝国の初代皇帝となり、後の世に先帝と呼ばれる存在となった。\n\n　ある日、アルヴァードは父の私室に呼ばれた。セイヴァードはすでに７０歳を迎え、アルヴァードは２５歳になっていた。父の顔には深い皺が刻まれ、かつての若々しさは失われていたが、幾多の戦場を駆け抜けてきたその背筋は、今もまっすぐに伸びていた。アルヴァードにとって、いつまでも誇らしい父だった。\n「ソーシャ、よく来たな。今日は大切な話がある」\n　セイヴァードは娘に椅子を勧め、自らもゆっくりと腰を下ろした。\n「おまえに譲らねばならんものがある」\n　その言葉に、アルヴァードは嫌な予感がした。まさか、帝位を譲るつもりでは……そんなものは真っ平ごめんだった。政や法律、経済といった面倒なことは、優秀な重臣たちや、いずれ成長する弟に任せればいい。自分には剣がある。戦士として戦場に立ち続けることこそ、自分にふさわしい生き方だと思っていた。\n　しかし、そんな娘の懸念をよそに、セイヴァードが差し出したのは一本の剣だった。\n「……これは……」\n　アルヴァードには見覚えがあった。父が長年身に帯び、幾多の戦場で振るってきた剣である。神々から授けられた聖剣だという噂は聞いていたが、父がそれを手放す日が来るとは思ってもみなかった。\n「それは、わしが若い頃……今のおまえよりもずっと若い頃、エル・ジーザスを討伐するために神々から託された神剣だ」\n\n　そのとき、アルヴァードは部屋の中に別の気配があることに気づいた。人払いをしていたはずの父の私室に、いつの間にか二人の人物が立っている。反射的に椅子から立ち上がり、身構えた。だが、不思議と敵意は感じられなかった。二人の姿は淡い光をまとい、その佇まいには、思わず息を呑むほどの神々しさがあった。\n「サー・アルヴァーディ。すべての母たるアルヴァーダインの力が秘められし剣」\n　セイヴァードの背後に立つ二人のうち、男の方が静かに告げた。アルヴァーダイン――その名は、アルヴァード自身の名前の由来となった創造神のものだった。\n「サーアルヴァディ……」\n　アルヴァードは、初めて耳にする神剣の名を小さく繰り返した。\n\n「神々との約束を、おまえに引き継がなくてはならない」\n　父の話は、まるで御伽噺のようだった。だが、目の前には神々しく光る聖剣があり、父の背後には淡い光をまとった二人の人物が立っている。到底、ただの作り話とは思えなかった。\n　とはいえ、父はもう長い間、戦場に出ていない。エル・ジーザスとの戦いも、今ではすべて自分が指揮している。今さら何を引き継ぐというのだろう。そんな思いが頭をよぎったが、アルヴァードは老いた父を気遣い、穏やかに答えた。 \n「これからのエル・ジーザスとの戦いは、すべて私が引き受けます。父上はもう、そのようなことをお気になさらぬように……」\n　そのとき、父の背後から静かな声が響いた。\n「これからの戦いは、今までとは違う。スセオーンスは、この世界に自らの器となる者を見つけ、実体を持って降臨しようとしているのだ」\n　先ほど神剣の名を告げた男だった。\n　セイヴァードの背後に立っていた二人が、静かに前へ進み出た。淡い光をまとったその姿を見つめながら、アルヴァードは彼らがこの世界の者ではないことを、すでに感じ取っていた。\n　――まさか、神々なのか……。\n「彼らこそ、わしにこの剣を託した神々だ」\n　まるでアルヴァードの心を読んだかのように、セイヴァードが告げた。\n　壮年の男神と、その傍らに立つ若い女神が、交互に語り始めた。\n「時の神スセオーンスは、ビルガン・デュラクの力を借り、この世界に降臨しようとしている」\n「スセオーンスは、この世界の生けとし生けるものから信仰を集め、再び私たち神々に戦いを挑もうとしているのです」\n「ビルガン・デュラク……」\n　アルヴァードは、思わずその名を口にしていた。\n　５年間、ずっと探し続けてきた人。いつか必ず戻ってくると信じ、再び会える日を待ち続けてきた人。そのビルガンが、時の神スセオーンスの降臨に関わっているというのか。\n　何かを尋ねようとしたが、言葉が出てこなかった。父も神々も、なお何かを語り続けていたが、その声はもうアルヴァードの耳には届いていなかった。\n\n＊\n　\n　気がつくと、アルヴァードは城を飛び出し、独り水晶の森を歩いていた。\n　父や神々と、どのような言葉を交わして城を出たのか、よく覚えていない。ただ、ビルガン・デュラクがこの森のどこかにいる。その思いだけが、彼女を突き動かしていた。\n　広大な水晶の森は、アルヴァードにとっても未知の場所が多かった。それでも、不思議と進むべき方向がわかるような気がした。木々の間を抜け、道なき道を進んでいくうちに、やがて森の奥に見慣れない建物が姿を現した。\n　森の奥に現れたのは、古びた神殿のような建物だった。その傍らでは、大地が巨大な口を開けたかのように裂け、底の見えない暗黒の穴が広がっていた。穴の縁では木々が根をむき出しにして傾き、今にも闇の中へ飲み込まれそうになっている。その深淵からは黒い煙のようなものが絶え間なく噴き上がり、地の底から響くような不気味な轟音が森を震わせていた。\n　アルヴァードは木陰に身を潜め、神殿の様子をうかがった。やがて、薄暗い入口から数人の男たちが姿を現した。いずれもエル・ジーザスの信徒らしい。その中央には、司祭を思わせる衣をまとった、一人の男がいた。\n　長い金髪が、風に揺れていた。\n　アルヴァードの胸が大きく高鳴った。遠目にも見覚えのある、その立ち姿。見間違えるはずがない。５年間、幾度となく思い浮かべ、もう一度会いたいと願い続けてきた人。\n　ビルガン・デュラクだった。\n\n　気がつけば、アルヴァードは木陰から飛び出していた。周囲のエル・ジーザスたちがこちらを振り向いたが、その姿は目に入らなかった。ただ一人、ビルガン・デュラクだけを見つめていた。\n　そして、彼と目が合った。\n　間違いない。あの銀色の瞳も、懐かしい面影も、記憶の中の彼と何も変わっていない。だが、長い金髪にわずかに混じっていた黒髪が、今は白銀の色に変わっていた。\n　かつて、どれほど年月を重ねても老いることのなかった男。その彼の身に、この５年間で何が起きたというのだろう。\nアルヴァードの姿を認めたビルガンの目が、大きく見開かれた。\n「なぜ……おまえが、ここに……」\n　その声も、記憶の中の彼と変わらなかった。\n　周囲のエル・ジーザスたちが一斉に身構える。アルヴァードには、聞きたいことも、伝えたいことも山ほどあった。だが、いざ目の前にすると、何一つ言葉にならない。敵意に満ちた信徒たちの視線を感じ、反射的に腰の剣を抜いた。たちまち、男たちも武器を構えた。\n「やめろ！」\n　ビルガンの一喝に、信徒たちの動きが止まった。\n　アルヴァードは彼を見つめた。先ほどまで驚きに見開かれていた銀色の瞳が、今は静かに自分を見つめ返している。その眼差しには、幼い頃から幾度となく向けられてきた、あの優しさが残っていた。\n　そのとき、アルヴァードの手にした神剣サーアルヴァディが、突如として強い光を放った。青白い輝きが周囲を照らし、エル・ジーザスの信徒たちの間にどよめきが広がった。\n　ビルガンの表情が変わった。苦しげに顔を歪め、片手で頭を押さえると、アルヴァードから目を逸らし、よろめくように神殿へと歩き始めた。\n「待って！」\n　思わず呼びかけたが、ビルガンは振り返らなかった。その背中が、神殿の暗がりへと消えていく。\n「あの女を捕らえろ！　あの剣はスセオーンス様を滅ぼす邪悪なる剣だ。必ず奪い取れ！」\n　ビルガンの傍らに控えていた黒いローブの男が叫んだ。次の瞬間、屈強なエル・ジーザスの戦士たちが、アルヴァードに向かって一斉に襲いかかった。\n\n\n　アルヴァードは襲いかかる戦士たちを斬り伏せ、木々の間を縫うように王都へ向かって駆けた。背後からは怒号と足音が迫り、振り返るたびに新たな追っ手が姿を現した。\n　手にした神剣は、なお青白い光を放っていた。しかし、神を斬る力を秘めたその剣も、人間の戦士を相手にする限り、一振りの剣にすぎない。どれほど剣の腕に優れたアルヴァードでも、次々と現れる屈強な戦士たちを、独りで相手にし続けることはできなかった。\n　王都までは、まだ遠い。枝を払い、木の根を飛び越え、幾度も追っ手の刃を退けながら走り続けたが、やがて呼吸は荒くなり、鎧の下を汗が伝い始めた。剣を握る手にも、少しずつ疲労が忍び寄っていた。\n\n　幾度目かの追っ手を退けたとき、アルヴァードの足がもつれた。片膝をつき、剣を地面に突き立てて身体を支える。木々の向こうから、再び武器を手にした男たちが迫ってきた。\n　――ここまでか。\n　そのとき、先頭を走っていた男が突然、前のめりに倒れた。背中には一本の矢が突き立っている。続けざまに放たれた矢が、さらに二人の追っ手を射抜いた。\n　木陰から現れたのは、黒いフードを目深にかぶった男だった。男は弓を捨てると、腰から赤黒い光を帯びた剣を抜き、アルヴァードに迫る戦士たちを瞬く間に斬り伏せた。\n「こっちだ」\n　差し伸べられた手を取ると、男はアルヴァードを引き起こし、そのまま森の奥へ走り出した。彼は森のすべてを知り尽くしているようだった。迷いのない足取りで木々の間を抜け、幾度も方向を変えながら進むうちに、背後の怒号は次第に遠ざかっていった。\n　その手の温もりに、アルヴァードの胸が震えた。幼い頃から、幾度となく自分の手を引いてくれた人。その大きな手を、忘れるはずがなかった。\n\n「ビルガン……」\n　ようやく、その名を呼ぶことができた。\n　５年間、聞きたいことは山ほどあった。なぜ父を裏切ったのか。なぜエル・ジーザスのもとにいるのか。そして何より、なぜ何も告げず、自分の前から姿を消してしまったのか。\n　男は静かにフードを取った。現れたのは、やはりアルヴァードのよく知る顔だった。長い金髪に混じっていた黒髪は、今では白銀に変わっている。かつて老いることを知らなかった彼にも、時は流れたのだろうか。\n　けれど、そんなことはもう、どうでもよかった。\n　口を開こうとしても、言葉にならない。代わりに、一筋の涙がアルヴァードの頬を伝った。ビルガンは何も言わず、ただ静かに彼女を見つめていた。その銀色の瞳に宿る優しさは、幼い頃から何一つ変わっていない。まるで、彼女が口にできずにいる幾つもの問いを、すべてわかっているかのようだった。\n「ソーシャ……」\n　懐かしい声が、静かに彼女の名を呼んだ。\n　アルヴァードは涙を拭い、ビルガンを見上げた。聞きたいことはまだ何一つ聞けていない。けれど、彼が何かを話してくれるのなら、今はただ、その言葉を待ちたかった。\n「私のもとに来い」\n　思いがけない言葉に、アルヴァードは目を見開いた。\n「スセオーンスのもとへ」\n　その声には、先ほどまでの温かさがなかった。銀色の瞳は変わらず彼女を見つめているのに、そこに宿る光が、ふと冷たくなったように感じられた。\n　ビルガンは背を向けた。\n「……やはり、父を裏切るのですか。あれほど長く共に戦い、強い絆で結ばれていたはずの父を……」\n　ビルガンは足を止めた。背を向けたまま、しばらく何も言わなかった。\n「私は、セイヴァードの言う国の統治とやらには、何の興味もない」\n　それは、かつて父と共に戦い、アルヴァードを育ててくれた男の言葉とは思えなかった。\n　ビルガンは再び歩き出した。アルヴァードは追いかけようとしたが、足が動かなかった。\n「私のもとへ来い……待っている」\n　最後にそれだけを残し、彼の姿は木々の向こうへ消えていった。\n　アルヴァードはしばらく、その場に立ち尽くしていた。腰に佩いた神剣サーアルヴァディが、先ほどよりも強い光を放っていることに気づいたのは、それからだった。\n\n＊\n\n　アルヴァードが城に戻ると、王都は騒然としていた。城門をくぐるなり、駆け寄ってきた兵士から告げられたのは、信じがたい知らせだった。\n　彼女の行方を追って自ら水晶の森へ入ったセイヴァードが、エル・ジーザスの奇襲を受け、重傷を負ったというのだ。\n　アルヴァードは息を呑んだ。つい先ほどまでビルガンのことばかり考えていた自分を、激しい後悔が襲った。\n　急いで自室へ戻り、血と泥に汚れた紅の鎧を脱ぐと、着替えもそこそこに父の寝室へ向かった。\n　扉を開けると、寝台に横たわるセイヴァードの姿が目に飛び込んできた。幾度となく戦場で先頭に立ち、どんな傷を負っても笑っていた父が、今は青白い顔で静かに横たわっている。\n「父上……私の身勝手で、こんなことに……」\n　アルヴァードは寝台の傍らに膝をつき、父の手をそっと握った。\n　皺に覆われ、すっかり細くなった父の手。幼い頃、何度も自分を抱き上げ、剣の握り方を教えてくれた、あの大きく力強い手が、今はこんなにも小さく感じられた。\n　セイヴァードはゆっくりと顔を向け、娘を見つめた。\n「はは……気に病むことはない。お前のおかげで、最後にもう一度、戦士として剣を振るうことができた。王様なんかしているより、こっちの方がよほど俺に似合っている」\n　弱々しい声だった。それでも、口元に浮かんだ笑みは、アルヴァードが幼い頃から見慣れた父のものだった。\n「あいつと会ったのか？」\n　不意にそう尋ねられ、アルヴァードは顔を上げた。父が誰のことを言っているのか、聞き返す必要はなかった。\n　彼女が小さくうなずくと、セイヴァードは天井を見上げ、深いため息をついた。\n「あいつのことは……誰よりも俺が一番よくわかっているという自信があった。だが、最後はあいつのことがわからなくなってしまったな……」\n　セイヴァードは天井を見つめたまま、しばらく黙っていた。\n「人の心というのは、結局、本人でなければわからないものよ」\n　そう言って小さく息をついたが、やがて苦しそうに咳き込んだ。アルヴァードが身を乗り出すと、父は大丈夫だと言うように、かすかに手を動かした。\n「いや……俺のような普通の人間が、あいつの心を推し量ろうとしたのが間違いだったのかもしれんな。この国は、あいつにはさぞ窮屈だったろう。いつまでもここに繋ぎ止めようとして、随分と申し訳ないことをしたものだ」\n　アルヴァードは何も言えなかった。常に明るく、太陽のような力強い笑顔を見せてきた父の顔が、今は深い後悔に歪んでいた。\n「俺は……あいつに甘えすぎていた。自分のやりたいことばかり話して、あいつが何を大切に思い、何をしたかったのか、もっと耳を傾けるべきだった」\n　セイヴァードはゆっくりと娘の方へ顔を向けた。その目には、いつもの力強さとは違う、静かな寂しさが浮かんでいた。\n\n「その剣は……俺がまだ若かった頃、スセオーンスを信奉するエル・ジーザスを討つために、神々から託されたものだ」\n　セイヴァードの視線が、アルヴァードの腰に佩かれた神剣へと向けられた。\n「俺の旅は、そこから始まった。あいつと出会い、共に戦い、幾つもの国を巡った……。長い旅だったな」\n　懐かしむように、セイヴァードの口元にかすかな笑みが浮かんだ。\n「エル・ジーザスを討ち、スセオーンスの復活を阻むこと。それが神々から与えられた俺の宿命だった。そして、その使命は、お前にも引き継がれている。その剣を振るうことができるのは、アルヴァーダインと盟約を交わした俺の血を引く者だけだ」\n　アルヴァードは腰の神剣に目を落とした。鞘に収められたサーアルヴァディは、なおも青白い光を放ち続けていた。\n　彼女は再び父を見つめた。セイヴァードの表情からは、先ほど浮かんでいた笑みが消えていた。\n「そして……俺は、お前にも悪いことをした」\n　セイヴァードは言葉を切り、娘の顔をじっと見つめた。\n「こんなことになってしまって……すまない……」\n　そのとき、父の目尻から一筋の涙がこぼれ、深い皺を伝って流れ落ちた。\n　アルヴァードは息を呑んだ。父の涙を見るのは、おそらく生まれて初めてのことだった。どれほど苦しい戦いの後でも、どれほど深い傷を負っても、父はいつも笑っていた。その父が、今、自分の目の前で涙を流している。とっくに枯れ果てたであろう涙を。\n「すまない……ソーシャ……」\n　かすれた声で、父はもう一度謝った。\n　アルヴァードは初め、その涙の意味がわからなかった。けれど、父の手を握りながら、ようやく悟った。\n　父は知っていたのだ。自分がビルガンをどれほど慕い、愛してきたのかを。そして、その相手を斬るという残酷な宿命を、ほかならぬ自分の娘に背負わせなければならないことを。\n　セイヴァードの涙は、そんな娘に向けられた、父としての贖罪の涙だった。\n　アルヴァードの目からも、大粒の涙がこぼれた。\n「これが宿命であるならば、私はそれを受け入れます」\n　涙を流しながら、アルヴァードは父の手を強く握った。\n　セイヴァードは娘を見つめ、かすかに微笑んだ。そして、残された力を振り絞るように、その手を握り返した。\n　やがて、握り返していた力が静かに失われていった。\n　セイヴァードは、そのまま息を引き取った。\n\n　＊\n\n　母違いの弟は、まだ幼い。しかし、セイヴァードが築き上げた帝国には、父が自ら選び出した３人の優れた王がいる。たとえ自分が戻らなくとも、彼らがこの国を護ってくれるだろう。\n　アルヴァードは再び紅の鎧に身を包んだ。\n　もう一度、あの神殿へ行かなければならない。そして、あの男に会わなければならない。\n\n　夜も更け、城内が静まり返った頃、アルヴァードは人知れず城を出ようとした。\n「お待ちなさい」\n　不意に声がした。\n　足を止めたアルヴァードの前に、二つの光が現れた。光は次第に人の姿を取り、輝きをまとった一組の男女となって彼女の前に立った。\n　アルヴァードには、その姿に見覚えがあった。\n　光と運命を司る兄妹神、アポロン・ダイスとアルテミシャ・ルーア。かつて父から神剣サーアルヴァディを受け継いだときにも、二柱はそこにいたのだ。\n「あなたは、ビルガン・デュラクのもとへ行くのですね？」\n　アルテミシャの問いに、アルヴァードは静かにうなずいた。\n「それは、彼を倒すために……？　それとも……彼と共に生きるために……？」\n　アルヴァードは答えず、腰に佩いた神剣へと視線を落とした。鞘の中では、サーアルヴァディが青白い光を放っている。\n　しばらくして、彼女は顔を上げた。\n「神々よ。それはもちろん、アルヴァーダインの御心に従い、スセオーンスの復活を阻止するためです」\n　兄妹神は互いに顔を見合わせ、静かにうなずいた。やがて、妹のアルテミシャが一歩前へ進み、アルヴァードに手を差し伸べた。\n「ならば、私たちもあなたに力を貸しましょう」\n　アルテミシャの差し伸べた手が、柔らかな光を帯びた。\n「その神を斬る剣だけでは、スセオーンスの時の技を防ぐことはできません。限られた時しか生きられない人間にとって、時の技は恐るべき力なのです」\n　アルヴァードは神剣を握る自分の手に目を落とした。\n「私があなたを器として、その身体を借りましょう。あなたが剣を振るい、私が時の技からあなたを護る。そうして、共に戦うのです」\n　アルヴァードはアルテミシャを見つめた。そして、差し伸べられた女神の手に、自らの手を重ねた。　\n\n　＊\n\n　光と運命の女神アルテミシャ・ルーアを身に宿したアルヴァードは、独り水晶の森の奥へと向かった。\n　夜の森は深い闇に包まれていたが、不思議と道に迷うことはなかった。行くべき方角が、まるで以前から知っていた道のように、自然と頭の中に浮かんでくる。アルテミシャが導いているのだろう。\n　やがて、夜明けを迎えるよりも早く、アルヴァードはあの神殿へとたどり着いた。\n　だが、目の前の光景は、先日訪れたときとは大きく変わっていた。\n　神殿の脇に口を開けていた暗黒の穴は、さらに大きく広がり、その縁は建物の一部にまで達していた。石造りの壁は崩れ、かつて神殿を支えていた柱の幾本かが、暗闇の中へと傾いている。\n\n　周囲にエル・ジーザスの戦士たちの姿は、ほとんど見当たらなかった。\n　スセオーンスの復活が近づいているのだろうか。もはや、この神殿を守る必要すらなくなったのかもしれない。\n　それとも、ビルガンはすでにここを去ってしまったのだろうか。\n　そう思ったとき、不意に頭の中で声が響いた。\n（彼は、あの神殿の中にいます）\n　アルテミシャの声だった。\n　アルヴァードは崩れかけた神殿を見上げると、神剣の柄に手を添え、静かにその入口へと歩き出した。\n　女神の言葉に従い、アルヴァードは、スセオーンスの神殿に足を踏み入れた。\n　崩れた天井からは夜空がのぞき、床には砕けた石片が散乱していた。かつて整然と並んでいたであろう柱も幾本かが倒れ、神殿の奥へと続く通路を塞いでいる。\n　その先に、彼はいた。\n　奥の玉座に腰を下ろしたビルガン・デュラク。その周囲には、数名のエル・ジーザスの戦士が、彼を護るように立っていた。\n「待っていたぞ……アルヴァード・ソーシャ……」\n　玉座から響いた声に、アルヴァードは足を止めた。\n　ビルガンの眼差しは、先日会ったときよりも暗く、どこか苦痛に歪んでいるように見えた。そして、不思議なことに、その長い金髪には、かつてのように黒い髪が混じっていた。\n　まるで、若い頃の姿へ戻りつつあるかのようだった。スセオーンスの器になったというビルガン。その身体が、今どれほど時の神に侵されているのか、彼女にはわからなかった。\n（もう、スセオーンスの一部が彼の身体の中にいるのを感じます）\n　頭の中に、アルテミシャの警告が響いた。\n\n「私と共に……スセオーンスに従うのだ、アル。永遠に……」\n　ビルガンは玉座に座ったまま、アルヴァードへ片手を差し伸べた。\n　アルヴァードは静かに首を横に振り、腰から神剣を抜いた。\n　サーアルヴァディの刀身から青白い光があふれ、薄暗い神殿の隅々まで照らし出す。その光の中で、ビルガンの玉座の背後に、怪しげな黒い影が揺らめいた。\n　ビルガンは光を浴び、苦しげに顔を歪めた。\n「スセオーンスに操られているあなたを、私が解放する」\n　その言葉が終わるや否や、ビルガンを護っていたエル・ジーザスの戦士たちが、一斉にアルヴァードへ襲いかかった。\n　アルヴァードは踏み込みざまに一人の剣を弾き、返す刃でもう一人を斬り伏せた。背後から迫る敵の気配に身をひるがえし、振り下ろされた剣をかわすと、そのまま残る戦士たちを次々と倒していった。\n　やがて、彼女と玉座の間を遮る者はいなくなった。\n　ビルガン・デュラクはゆっくりと立ち上がり、腰に佩いていた剣を抜いた。\n「おまえに、私は倒せないぞ。ソーシャ……」\n　その手に握られた魔剣デュロイザークが、サーアルヴァディの青白い光に呼応するように、赤黒い輝きを放ち始めた。\n　アルヴァードは神剣を構え直した。かつて幾度となく剣を教わった師が、今、目の前に立っている。\n（気をつけなさい。あれはスセオーンスの力を宿した神剣デュロイザーク。あの剣を使って、彼は時の技を操ることが……）\n　アルテミシャの言葉が終わるよりも早く、二人の剣が激しくぶつかり合った。\n「スセオーンスの復活を妨げる者は、誰であれ排除する」\n　ビルガンの言葉とともに、赤黒い刃がアルヴァードへ迫った。\n　アルヴァードはその一撃を受け流し、すかさず反撃に転じた。しかし、ビルガンは彼女の剣が振り抜かれるよりも早く身を引き、次の一撃を繰り出してくる。\n　互いの剣がぶつかるたびに、青白い光と赤黒い光が飛び散り、崩れかけた神殿の壁を照らした。\n　アルヴァードの剣筋を、ビルガンは知り尽くしていた。幼い頃から彼女に剣を教え、その成長を見守ってきたのは、ほかならぬ彼自身なのだ。\n　だが、それはアルヴァードにとっても同じだった。師の構え、踏み込み、剣を振るうときのわずかな癖まで、彼女の身体には深く刻み込まれている。\n　幾度となく剣を交えながら、アルヴァードは少しずつ間合いを詰めていった。かつては一度も勝てなかった師の剣を、今は確かに押し返している。\n　二人の戦いを邪魔するものは、ここには何もない。ただ、神殿には、二人の剣戟だけが響いていた。\n\n　戦いが続くにつれ、アルヴァードの優勢は次第に明らかになっていった。ビルガンは彼女の剣を受け流しながら後退し、やがて大きく間合いを取った。\n　その背後には、神殿の一部を呑み込んだ暗黒の穴が広がっていた。\n　ビルガンは穴の縁へと近づき、しばらくその深淵を見つめた。まるで、そこから何かを得ようとしているかのように。\n　やがて振り返ると、デュロイザークの切っ先をアルヴァードへ向け、低い声で何事かをつぶやいた。\n　その瞬間、アルヴァードは目に見えない何かが自分に迫ってくるのを感じた。それは、風でも、熱でもない。これまで幾多の戦場で経験してきた、どんな力とも違っていた。\n　だが、それが何なのか、彼女にはわからなかった。\n（これこそが、スセオーンスの時の技……）\n　アルテミシャの声が、アルヴァードの頭の中に響いた。\n（あの男は、あなたの身体の時を止めようとしています。この技を受ければ、この世界の住人は誰であろうと、戦うことはおろか、指一本動かすことさえできなくなるのです）\n　アルヴァードはビルガンを見つめた。彼はなおもデュロイザークをこちらへ向け、何事かをつぶやき続けている。\n（この力は、私が引き受けます。あなたは、その剣であの男を……）\n　アルテミシャの言葉が途切れた。\n　同時に、アルヴァードを包もうとしていた得体の知れない力が、ふっと消えた。\n　もう、アルテミシャの声は聞こえてこなかった。\n\n　ビルガンは怪訝そうにアルヴァードを見つめていた。時を止めたはずなのに、彼女は何事もなかったかのように動いている。\n　アルヴァードはその隙を逃さず、サーアルヴァディを手に一気に間合いを詰めた。\n　ビルガンは剣を構えた……が、アルヴァードが突き出した神剣を受け止めようとはしなかった。\n　それどころか、彼は自ら一歩、剣の切っ先へと踏み込んだように見えた。\n　アルヴァードは息を呑んだ。急所を外して突き出したはずの剣が、ビルガンの胸の中心へと吸い込まれていく。\n　青白い刀身が、ビルガンの心臓を貫いた。\n　次の瞬間、崩れかけた神殿に、おぞましい断末魔が響き渡った。\n　それは、明らかに聞き慣れたビルガンの声ではなかった。\n　神を斬る神剣は、ビルガン・デュラクの中に宿っていたスセオーンスの一部を滅したようだった。彼の長い金髪に混じっていた黒髪が、以前会った時のように、少しずつ白く変わっていくのが見えた。\n　アルヴァードは驚いて剣から手を離した。致命傷を避けて剣を突き出したはずだったのに、サーアルヴァディはビルガンの心臓を貫き、今もその胸に突き刺さったままだった。\n　ビルガン・デュラクは神剣で貫かれながら、アルヴァードに視線を向けた。その眼差しは、かつて彼女が知っていた、温かなものだった。\n　そして……その瞳から一筋の涙がこぼれ落ちた。\n　アルヴァードは息を呑んだ。ビルガンの涙を見るのも、生まれて初めてのことだった。\n「すまない……ソーシャ……」\n　父が最期に見せた涙が、そして父の最期の言葉が、脳裏によみがえった。\n「わたしの弱い心は、時の流れに打ち克つことができなかった……」\n　アルヴァードは、ビルガンの白く戻った髪を見つめた。この人ほどの者でも、老いることが怖かったのだろうか。\n「……ソーシャ……おまえをセイヴァードのように失いたくなかった……」\n　アルヴァードは、はっとしてビルガンの顔を見上げた。\n　ビルガンは、胸に突き刺さったサーアルヴァディの柄を握り、自らの身体からゆっくりと引き抜いた。\n　アルヴァードが思わず手を伸ばしたとき、彼の身体はすでに暗黒の穴へと傾いていた。\n　ビルガン・デュラクは、そのまま底知れぬ闇の中へと消えていった。\n\n　アルヴァードはただ、大粒の涙をこぼしながら、その場に崩れ落ちた。　\n\n\n\n大陸暦２３年、紅の聖戦士アルヴァード・ソーシャは、神々の王アルヴァーダインより授けられし聖なる神剣サルヴァドゥにより、スセオーンスの器となったビルガン・デュラクを斬った。\n　その後、彼女はいずこかへ姿を消したが、その理由は明らかではない。ただ、彼女が再びスサンス大陸の歴史の舞台に現れることはなかった。\n\n　このスサンス大陸には、もはやヴィルガンディリアも、セイヴァードも、アルヴァードもいなかった。\n\n\nSUSANS Continental Era Year 23\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n第三章　魔法の時代\n\n【この章の登場人物】\n\n\nケル・カイオス：\n\n\n\n\nケル・カイト：当時\n\n\n\n\nカイエル：セイ\n\n\n\n\n\n第一節　ケル・カイオス\n\n　大陸歴５５０年－－スサンス大陸の北西に位置する、魔術師達の集うソーサリー島。\n　大魔法使いケル・カイオスは、このソーサリー島の中心に建てられた太陽の塔の最上階の自分の部屋で、新しい魔術の研究に没頭していた。この太陽の塔は、彼が大陸内外から集めた書物で埋め尽くされており、彼に使える多くの司書達が、毎日のようにその整理に追われていた。彼の収集するあらゆるものは、もはや、この塔だけでは収まらなくなり、彼は太陽の塔の周りに、新しい塔を建て始めていた。\n　そんなソーサリー島には、ケル・カイオスが集める多くの知識を求めて、たくさんの魔術師が訪れ、また彼らが新しい知識を残していった。\n　\n　火・水・風・土……多くの魔術師が一生をかけて習得する四元素の魔法はもちろん、様々な概念からなる魔法の研究を彼は行った。\n　そんな魔術師ケル・カイオスは、神々の信仰などとは無縁のように見えたが、実際のところは、創造神アルヴァーダインに仕える敬虔なるものであり、神学についても深い興味を持っていた。そして、アルヴァーダインと同じように、彼もいろいろなものを創造することをこよなく愛していた。\n　貪欲な知識欲、そして創造欲。 とにかく、ありとあらゆるものに興味を持つ彼は、いつも多忙であり時間がなかった。\n　\n　そこに、助けを求める使者がくる。\n　ソーサリー島に接するスサンス大陸のアステラス王国からの使者だ。\n　この頃頻繁にこのソーサリー島にやってくる。力を貸して欲しいと。\n「あながた希望なのです」\n　しかし、魔術の研究に没頭しているケルカイオスは、あまり乗り気ではない。\n　彼はとにかく多忙であった。\n\nあぁ、もう一人自分がいたら……\n彼は何度も思うのだった。\n\n\n第二節　ケル・カイト\n\n　煙のようなその存在は、やがて人の姿となり、太陽の塔を駆け巡った。\n彼の集めたあらゆる書、彼が書き留めたあらゆる記述を、何日もかけて読み解き学習していった。\n　スタンドであるAIケルカイオス・ソル！が誕生する。\n　ケル・カイオスでは紛らわしい。\n　カイト（分身）から、ケル・カイトと名付けることにした。\n　自分の分身。\n　　\n　時間がない。そして、時間を遡れたらもっとたくさんの知識を手に入れることができる。\n　いつしか、ケル・カイトはそのような誘惑をケル・カイオスにささやくようになった。\n　時の力・・・\n　しかしその時既に、ケル・カイトは、スセオーンスの精神体である暗黒の魔導士カイエルに操られ始めていたのであった。\n\n\n　\n　暗黒の魔導士に挑むケル・カイオスとケル・カイト。\n　しかし、時の技には勝てない。\n　ケル・カイオスはやむなくソーサリー島へ撤退する。\n\n第三節　カイエル\n\n　エル・ジーザスに敗れ滅びゆくアステラス王国。\n　ケル・カイオスは、アステラスの王都を浮かせて逃がす。\n　姫戦士が残した神剣サルヴァドゥ、彼自身は使わないがその剣が持つ力を研究し、神を打ち消す力を編み出す。\n　\n\n　ケル・カイオスは、ケル・カイトと合体し、さらにその彼を器としてアポロン・ダイスが宿る。三体合体で古今東西最強の魔法使いになり、スセオーンスの精神体にして暗黒の魔導士カイエルを倒す。\n\n　だが、その後、ケル・カイオスも姿を消す。誰も彼の姿を見かけることはなかった。\n\n\n\n\n  \n","pages":[{"id":"page-root","text":"第一部\t古の時代\n\n"},{"id":"page-toc-2","text":"第一章\t神々の時代\n\n第一節\t序\n\n　はるか昔――まだ世界が今の姿を成すよりも前のこと。\n\n　すべての存在の源泉たる、“ウォル”と呼ばれる力があった。\n　そのウォルより、天界に三柱の神が生まれた。\n\n　ひとりは、あらゆるものを生み出す創造の神。\n　ひとりは、生み出されたものを壊す破壊の神。\n　そしてもうひとりは、その二つを調停し、世界の均衡を保つ神。\n\n　三柱の主神による創造と破壊と両者の調和。その果てしない営みの中から、やがて世界を形づくるさまざまな概念が生まれ、それらを司る神々が生まれ、さらには人間をはじめとする多くの生命が生み出されていった。\n\n　神々といえども、そこに在るだけで永遠に存在できるものではなかった。\n　その世界に生きる者たちから、“信仰”を得られぬ神は、やがて力を失い消滅し、深い信仰を集めた神は、その力を保ち続けることができた。\n　ゆえに神々が世界の住人たちに求めたものは、深く清らかな信仰であり、時にはその信仰をめぐって神と神が争うことさえあった。\n\n　――スサンス大陸。\n\n　人間を初めとする様々な生命が産み落とされた物質界に存在する、一つの大陸。\n　だが、その大地は初めからそこにあったわけではない。\n　太古の時代、“時”という概念を司る一柱の神を封じるため、その大陸は創られた。\n\n　その神の名は――スセオーンス。\n\n　そして、その神を封じた大地こそが、これから語られる物語の舞台となる、スサンス大陸である。\n\n\n\n"},{"id":"page-toc-4","text":"第二節　アルヴァーダイン\n\n　神々の住まう天界。\n\n　そこに、二柱の若き神が呼び出されていた。\n　兄の名は、アポロン・ダイス。\n　妹の名は、アルテミシャ・ルーア。\n　ともに光と運命を司る、兄妹の神である。\n\n　二柱の前には、天井から床までを覆う、白いレースのカーテンが垂れていた。その向こうにいるのは、この世界の始まりから存在する三柱の主神――創造、破壊、そして調和を司る神々である。\n　だが、その姿は見えない。\n　天界に住む神々でさえ、三主神の姿を直接目にすることはほとんどなかった。アポロンとアルテミシャもまた、白いカーテンを隔て、その向こうから響く声を待っていた。\n\n　やがて、静寂の中に、穏やかな声が響いた。\n\n「これまで、たくさんのものを生み出してきました」\n　創造神アルヴァーダインの声だった。\n「あなたたちも。そして――あの子、スセオーンスも」\n　そこで、声が一度途切れた。\n\n「けれど、スセオーンスが司る力は、私たちの想像を超えるものでした。あの子はその力に溺れ、やがて天界のすべてを自らのものとしようとした」\n\n　白いカーテンは、微動だにしない。\n\n「私たちとて、“時”の力から逃れることはできなかったのです」\n　アポロンの視線が上がった。\n　隣に立つアルテミシャも、わずかに顔を動かす。\n\n「スセオーンスは、長い時をかけて、私たちに自らの時の力を及ぼしていました。ほんのわずかずつ……私たち自身にも気づかれぬほど、ゆっくりと――“時の呪い”とでも、呼ぶべきでしょうか」\n　再び、沈黙が訪れた。\n\n「私たちが気づいた時には、すでに――」\n　言葉が止まる。\n　やがて、その静寂を破るように、アルヴァーダインの声が続いた。\n「スセオーンスは私たちを退け、天界の王となろうとしています。けれど、今の私たちには、もうあの子の力に抗う力はありません」\n　アポロンとアルテミシャは、黙ったまま白いカーテンを見つめていた。\n\n「だから、あなたたちを呼んだのです」\n　その時だった。\n　白いレースが、かすかに揺れ、その中央に細い隙間が生まれる。\n　そこから、一本の手がゆっくりと差し出された。\n\n　アポロンの視線が、その手に止まった。アルテミシャも動かなかった。\n　二柱は、その手を知っていた。\n　かつて目にした創造神アルヴァーダインの手は、白く、若々しく、生命力に満ちていた。\n　万物を生み出した、すべての母。生命力の源である創造神アルヴァーダイン。\n\n　だが、二柱の前に差し出されたその手は、永い年月を生きた人間の老女のもののように、細く、深く皺んでいた。\n　そして、その手の上には一本の剣があった。\n　青白い光が、脈打つように刀身を走っている。\n\n　白いカーテンの向こうから、アルヴァーダインの声がした。\n\n「この剣には、私に残された力を託しました」\n　アポロンの視線が、老いた手から剣へと移る。\n「神の力に抗えるのは、神の力だけ。これは、私に代わってその力を振るう剣です」\n\n　わずかな沈黙があった。\n\n「この私の代わりの剣で――」\n　再び、声が途切れる。\n「スセオーンスを、斬りなさい」\n\n　アポロンが剣へ手を伸ばす。\n　だが、その指先は一度、止まった。\n　視線が、剣から、それを支える皺深い手へと移り――やがてアポロンは両手で、青白く輝く剣を受け取った。\n\n「サー・アルヴァーディ……」\n\n　小さな声が、白い空間に響いた。\n　神々の言葉で――**アルヴァーダインの代理**\n\n　剣がアポロンの手へ渡ると、皺深い手はゆっくりと白いレースの向こうへ消えていき、再びカーテンが閉じた。\n　その向こうからは、もう何も聞こえなかった。\n\n\n\n"},{"id":"page-toc-5","text":"第三節　スセオーンス\n\n　三柱の主神のもとに、光と運命を司る兄妹神、アポロン・ダイスとアルテミシャ・ルーアが再び姿を現した。二柱の姿には、先ほどまで続いていた戦いの激しさが刻まれていた。\n　中でもアポロンの変貌は著しく、若々しかったその顔には深い皺が生まれ、髪にも時の流れが刻まれている。先ほどまで青年の姿をしていた神が、今は壮年の男のように見えた。一方で、その隣に立つアルテミシャには、兄ほどの変化は見られない。兄が妹を庇ったであろうことは明らかだった。\n　神々とて、永遠の存在ではない。\n　スセオーンスの“時の呪い”は、確かに兄のアポロンの身に及んでいた。\n\n「スセオーンスを滅ぼすことは、できなかったようだな」\n　白いカーテンの向こうから、低い声が響いた。\n　アポロンは答えなかった。\n　その手には、青白い光を宿した剣――サー・アルヴァーディが握られている。\n「その剣があれば、あの子を斬ることができたはずです」\n　今度は、アルヴァーダインの声だった。\n　兄妹は黙ったまま、顔を伏せた。\n　しばらくの沈黙の後、アポロンが口を開いた。\n「スセオーンスは天界を離れ、物質界へ逃れました」\n「ならば、追わねばならぬ」\n　間を置かず、先ほどの低い声が答えた。\n「奴を生かしておけば、いずれ物質界の者たちから信仰を集め、再び力を取り戻す。そして同じことを繰り返すだろう」\n　別の声が、静かに続いた。\n「まして物質界で、自らに適した“器”を得ることになれば……容易には止められなくなるでしょう」\n　アポロンは何も答えず、アルテミシャも、兄の隣で黙っている。\n「なぜ、斬らなかった」\n　低い声が再び問うた。\n　アポロンの手が、わずかに動いた。\n　握られたサー・アルヴァーディに青白い光が走り、アポロンの視線がその剣へ落ちた。\n「この剣は……母なるアルヴァーダインの力を託されたもの」\n　それだけを言って、アポロンは言葉を止めた。\n　白いカーテンの向こうから返事はない。\n「それに――」\n　アポロンが顔を上げる。\n「スセオーンスを消し去れば、 “時の呪い”を解く術も、永遠に失われるかもしれません」\n　沈黙。\n　アポロンの視線が白いレースへ向けられたが、主神達は何も答えなかった。そして、その向こうから、先ほど見た皺深い手が再び現れることもなかった。\n\n「私たちが物質界に行きます」\n　沈黙を破ったのは、アポロンだった。\n「スセオーンスが器を得る前に追いつき、物質界の地に封じます」\n　隣に立つアルテミシャが、静かに兄を見て、アポロンと同じように白いカーテンへ向き直った。\n「二度と、あの力を振るうことができぬように」\n　しばらく、誰も言葉を発しなかった。\n\n　やがて白いカーテンの向こうから、声がした。\n「……行きなさい」\n　アルヴァーダインの声だった。\n　\n＊\n\n　物質界。\n　人間をはじめ、多くの生命が暮らす世界。そこに生きる者たちの信仰は、神々に力を与える源でもあった。\n　天界を追われ、力を失ったスセオーンスがここを目指したのも、この世界における信仰を集め、失った力を取り戻すためだった。\n　そして、そこにはまだ、“スサンス”という名の大陸は存在していなかった。\n\n　青く澄みきった空に、小さな黒い穴が現れた。\n　初めは点にしか見えなかったその穴は、ゆっくりと広がっていき、やがてはその奥から、青い光を帯びた煙がシュウ、シュウ――漏れ始める。\n　低い音とともに吐き出される煙は止むことなく広がり、澄みきっていた青空を覆っていった。\n　風が荒れ、海面が波打ち、やがて巨大な波がぶつかり合う。\n　空と海が荒れ狂う中、黒い穴はなおも広がり続けた。\n\n　数日が過ぎた。\n　そしてついに、穴の奥から一つの巨大な球体が姿を現した。\n　闇のように黒い球体。その表面を、弱々しい青い光が覆っている。\n　時を司る神――スセオーンス。\n\n　天界での戦いによって、既にその力は大きく失われていた。そして、神々が物質界に存在し続けるためには、自らに適したこの世界の“器”を見つけなければならなかった。\n　青い光をまとった黒い球体は、荒れ狂う空をゆっくりと進んでいく――自らの器を見つけて、信仰により再び力を取り戻すために。\n\n　だが、間もなく、その背後にある黒い穴が再び輝き、二つの光が飛び出した。\n　アポロン・ダイスとアルテミシャ・ルーア――スセオーンスがこの世界で自らの器を得る前に、兄妹は追いついたのだ。\n　\n　三つの光が、荒れ狂う空で交錯し、再び神々の戦いが始まった。\n　三柱の力がぶつかるたび、空が震え、海が割れ、青い閃光が世界を照らした。\n　しかし、スセオーンスには、既にかつての力は残されておらず、その戦いは天界で繰り広げられた死闘のように長くは続かなかった。\n　兄妹は逃げるスセオーンスを追い詰め、やがて、黒い球体を覆っていた青い光が消えた。残されたのは、光を失った暗黒の球体だけだった。\n\n　アポロンとアルテミシャは、その球体を海へと押し込んだ。海が裂け、海底の大地が轟音とともに割れて、深い亀裂の底へ、スセオーンスが沈んでいく。\n　二柱の光が、その亀裂の上で重なると、海底が隆起し、巨大な岩盤がスセオーンスを覆っていく――こうして、スセオーンスは物質界の地の底深くへと封じられた。\n\n　すべてが終わった後、荒れ狂っていた海は、やがて静けさを取り戻した。\n　だが、そこには以前には存在しなかったものがあった。\n　広大な海のただ中に、一つの巨大な大陸が生まれていた。地の底に眠る時の神が、再び世界へ現れることのないように創られた巨大な封印。\n　いわば、大陸そのものが“封印の扉”であった。\n\n　長い時が流れた。\n　やがてその大陸には人々が暮らすようになり、国が生まれ、数えきれないほどの物語が紡がれていくことになる。\n　そしていつしか人々は、地の底に封じられた神――スセオーンスの名に因んで、その大陸をこう呼ぶようになった。\n　“スサンス”大陸。\n　こうして、この物語の舞台が創造された。\n\n\n\n"},{"id":"page-toc-6","text":"第二章\t英雄たちの時代\n\n【この章の登場人物】\n\nヴィルガンディリア：\n水晶の森に暮らす長命の男。豊富な知識と経験を持ち、セイヴァードと出会ったことで、その運命を大きく変えていく。\n\n\nセイヴァード・カーン（先帝）：\n当時大陸を跋扈していたエル・ジーザス教の勢力を打ち破り、初めて大陸を統一した人間の戦士。\n\nアルヴァード・ソーシャ：\nセイヴァードの娘。紅の戦士と呼ばれる剣の達人。\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"id":"page-toc-7","text":"第一節　ヴィルガンディリア\n\n　時の神スセオーンスを封印するための神々の戦いから、何千年、何万年の時が経過した。そして、これは今より１０００年程前のことである。\n\n　大陸の中央には、古くから“水晶の森”と呼ばれる広大な森があった。\n　朝の光が木々の隙間から差し込むと、森はその名の通り、無数の水晶を散りばめたように輝いた。だが、輝いているのは水晶ではなく、木々の枝に実った、透き通るような果実だった。\n　薄い青や緑を帯びたその実は、陽光を受けるたび、森の奥深くまで淡い光を返す。鳥たちがそれを啄み、小さな獣たちが落ちた実を拾う……森に暮らす者たちにとって、それは珍しいものでも神秘的なものでもない、いつもの光景だった。\n\n　この水晶の森には、“クリスタル・エルフ”と呼ばれる者たちが暮らしていた。\n　エルフと呼ばれる者たちは、姿こそ人間とよく似ているが、人間よりもはるかに長い時を生きる種族であり、人間のように大きな集落を築いて群れるより、森や山、湖といった自然の中に居場所を見つけ、その土地とともに静かに生きる者たちだった。\n　この不思議な森の魅力に惹かれ、血筋も、生まれた土地も一様ではない、大陸の内外からやって来た多様なエルフたちが、長い年月をかけてここに根を下ろした。いつしか人々は、森の名になぞらえて、彼らをまとめてクリスタル・エルフと呼ぶようになった。　　\n\n　そんなクリスタル・エルフ達の間で、“不老の男（ラーク）”という愛称で呼ばれていた一人の男が森の中を歩いていた。\n　ヴィルガンディリア\n　長い金色の髪の間から、わずかに尖った耳が覗いている。見た目だけなら、まだ若い青年のようだったが、彼はすでに１００年以上の時をこの森で過ごしてきた、クリスタル・エルフ達の中でも最古参といえるほどの古株だった。彼自身、自分が正確に何歳なのかは覚えていなかったし、幼い頃の記憶もほとんどなく、自分の身体にどのような血が流れているのかも知らなかった。\n　ただ、彼の金髪のところどころには黒髪が混じり、時折その顎に薄い無精髭が浮かぶことがあった。どうやら、エルフだけではない人間等の他の種族の血が混じっていることは感じていたが、ヴィルガンディリアにはあまり興味がないことだった。　\n　　自分が何者なのか。\n　　あと何年生きるのか。\n　そんなことを考えるより、彼はただ、この森で静かに生きていければ、それでよかった。風が木々を抜ける音、水晶の果実が朝日に輝く光景、夜になると聞こえてくる小さな生き物たちの声、そういうものを日々感じられればそれでよかった。\n\n「ラーク？」\n　不意に後ろから声がした。\n　振り返ると、昔から見知った一人の男――ヴィルガンディリアよりもずっと歳老いて見えるが、実際には、彼と同い年程のはずの男が立っていた。\n「今夜は来るのだろう？」\n「……何に？」\n「今日は、うちで食事をすると言っただろう、忘れたのか」\n　ヴィルガンディリアはしばらく黙っていた。\n「……すまないが、今日は遠慮させてもらう」\n「今日“も”…だろう、ラーク。お前はいつまでも見た目は変わらないが、中身は随分と変わってしまったな」\n　ヴィルガンディリアは、ため息交じりにそうつぶやく友人の顔を見た。いつからだろう、この男はいつの間にかこんなにも老いてしまった。\n「気が向いたら来い、皆がお前に会いたがっている」\nそう言い残して、彼は去っていった。\n「あぁ、約束を忘れてしまって悪かったな……」\n　ヴィルガンディリアは、その背中をしばらく見送っていた。\n　\n　長く生きるということは、多くのものと出会うということだったが、同時にその出会った多くのものと別れるということでもあった。ラーク、すなわち不老の男という異名を持つヴィルガンディリアはこれまでに、何人もの仲間を見送ってきた。それは人間よりはるかに長命な、この森のエルフたちが相手であっても変わりはしなかった。\n　出会い、共に過ごし、親しくなる、そして周りはいつか自分を追い越して老いてゆき、自分だけを残していなくなる。何かを、誰かを、深く愛すれば愛するほど、その別れは彼にとっての耐え難い痛みとなった。\n　そんな経験を幾度となく繰り返していくうちに、ヴィルガンディリアは、その痛みから逃れるように、仲間たちと少しずつ距離を置くようになっていた。\n\n　＊\n\n　ある日、１００年以上続いたヴィルガンディリアの水晶の森における静かな暮らしは、ある侵略者たちによって、突然終わりを告げた。\n　森に悲鳴が響くと共に、鳥たちが一斉に飛び立ち、木々の向こうから黒い煙が上がった。\n\n　水晶の森の侵略者は、時の神スセオーンスを信奉する者たち――“エル・ジーザス”だった。彼らは人間を中心に、さまざまな種族の者たちが入り交じった集団であり、その目的はただ一つ、この地に封じられたとされる伝説の時の神スセオーンスを復活させ、その時の力によって永遠の命を得ること、であった。\n　スサンス大陸の歴史において、彼らエル・ジーザスは幾度となく出現し、そのたびに各地の平穏を脅かしてきた。\n\n　そのエル・ジーザスの一群に、水晶の森が狙われたのだ。\n「西へ行け！」\n　ヴィルガンディリアは仲間たちに叫んだ。　\n「森の奥へ！　ここには戻るな！」\n　弓を手に、彼は一人、仲間たちとは逆の方向へ走った。\n　長く森で暮らしてきたヴィルガンディリアは、まともな“戦い”というものをほとんど知らなかったが、森のことは誰よりも知っていた。獣の通り道、足を踏み入れれば沈む地面、蔦に隠れた窪地、どの枝が人の重みに耐え、どの枝が簡単に折れるかも、誰よりも知っていた。彼にとって森そのものが武器だった。\n　仕掛けた罠に侵入者が落ちる、木々の間を矢が走る、姿を見せては消え、追わせては別の道へ誘い込む――ヴィルガンディリアは、侵入者たちを森の中心から少しずつ遠ざけていった。\n　\n　だが、敵の数が多すぎた。\n　一人倒しても、その後ろから二人が来るうえ、その向こうからもさらなる足音が聞こえてくる。\n　やがては彼の罠も矢も尽きた。\n　ヴィルガンディリアは弓を捨て、傷を負った手で腰の剣を抜いたが、もう既に息が上がっていた。\n　――ここまでか。\n　死ぬことそのものは怖くなかった。\n　もう、十分に長く生きたと思う……。それよりも、自分が倒れた後、この侵略者たちが森の奥へ向かうことのほうが気になり、彼はもう一度、剣を握り直した。\n　そのときだった。\n「伏せろ！」\n　聞き慣れない人間の言葉が飛んできた。\n　意味を考えるより先に、何者たちかがヴィルガンディリアの横を駆け抜けた。その者たちの先頭に立つ黒髪の青年の剣が、ヴィルガンディリアへ迫っていた男の武器を弾き飛ばした。\n「大丈夫か！」\n　黙っていたヴィルガンディリアに、今度は青年が困った顔をした。\n「……言葉、通じてないのか？」\n「いや、分かる」\n「なんだ、よかった！　俺たちはエル・ジーザスじゃない、味方だぞ」　\n　こんな状況だというのに、青年は笑った。\n「話は後だ、まだ来るぞ」\n　二人は、互いを背にして同時に剣を構えた。\n　初めて会った人間であり、名も知らないし、彼が何をしにこの水晶の森に入って来たのかも分からない…それなのに、不思議と背後を気にする必要がないように思えた。\n\n　戦いが終わった頃には、森の向こうから朝の光が差し始めていた。\n　青年は屈託のない笑顔でヴィルガンディリアに手を伸ばし、自分のことを指差した。\n「俺は“セイヴァード”という。奴らを追っていたら、こんな森の中にまで来てしまった」\n　彼は、他の仲間たちと共に、人間の世界を襲ったエル・ジーザスを討伐するため、この水晶の森の辺境にまでやって来ていたのだった。ヴィルガンディリアは彼らたちと共闘することで、エル・ジーザスを水晶の森から退けることに成功した。そしてエル・ジーザスの討伐軍を率いるこの人間の青年こそが、今からおよそ２０年の後に、このスサンス大陸で初めて人間の王国を定立する、先帝セイヴァード・カーンその人であった。\n　青年は、今度はヴィルガンディリアを指さした。\n「おまえの名は？」\n「……ヴィルガンディリア、この森では、皆に“ラーク”と呼ばれている」\n「ヴィルガン……ラーク…」\n　人間である彼にエルフの言葉はうまく聞き取れないようだった。\n　ヴィルガンディリアが眉をひそめると、その青年はまた笑った。見た目でいえば、その青年はヴィルガンディリアとあまり歳が離れていないように見えた。しかし、人間の寿命を考えれば、彼はずっとずっと若い……自分にとっては幼子のような者のはずだった。だが、長い間仲間たちから距離を置き、独りで生きてきた自分は、何者かとの接触に飢えていたのかもしれない。ヴィルガンディリアは、セイヴァード達と共にいることで、自分の内面が満たされていくのを感じた。\n　また、もしかしたら自分の身体にもその血が流れているかもしれない人間という種族と初めて接触することに、なんとも言いえない好奇心が湧くのを感じていた。自分にとっては無限とも思えるような“時間”……その時間という資源に限界があることを意識して行動する人間達の姿は、ゆっくりとした時間の中で生きてきたヴィルガンディリアにとってはとても新鮮なものに映った。\n\n　１００年もの間、水晶の森を出たことがなかったヴィルガンディリアは、いつの間にか、セイヴァードと共に旅をするようになった。\n　最初は、水晶の森の周辺からエル・ジーザスを追い払うまでのつもりだった。だが、次の土地まで…次の戦いまで…と繰り返しているうちに、１００年以上出たことのなかった水晶の森はいつの間にか遠くなっていた。\n　彼は、セイヴァードと行動を共にすることで、初めて外の世界を知った。長寿のエルフ族が住み、悠久の時間が流れている水晶の森より、とても刺激的で変化に富むこの外の世界を知った。ヴィルガンディリアは、己の中の止まっていた時が、静かに動き出したように感じた。\n\n　＊\n\n　人間達を率いて平和な世を求めていたセイヴァードも、ヴィルガンディリアの才能と豊富な経験・知識を頼りにしていた。森の中で出会ったその金髪の青年は、もしかしたら自分よりも年若いかもしれないのに、この大陸のいろいろなことを知っている。土地を知り、植物を知り、動物を知り、人間が知らない古い伝承を知り、時には人間とは異なる言葉を話す者たちとの橋渡しにもなった。剣の腕前も弓の腕前も、自分が知り得る優秀な戦士たちに劣らない。最初は、ヴィルガンディリアの話すエルフの言葉がよくわからなかったが、すぐに人間の言葉を流暢に話してくれるようになった。\n　いつの間にか、セイヴァードの背後には常にヴィルガンディリアがおり、時には共に剣を振るい、時には世界に平和を導くために、夜通し意見を交わし合った。ヴィルガンディリアは、自ら表に立つことを望まなかったし、歴史に名を残したいなどとは微塵も思わなかったが、彼こそが、セイヴァードの建国を支えた第一の英雄であることを、セイヴァードと共に戦った者たちは皆よく知っていた。\n\n　そして幾多の戦い――その多くは各地に跋扈するエル・ジーザスとの戦いであった――を経て、ついにセイヴァード・カーンは、スサンス大陸で初めてとなる人間の王国を築き上げた。２６歳でヴィルガンディリアと出会ったセイヴァードは、２２年の戦いを経て、既に４８歳になっていた。\n　これが、大陸歴０年、いまからおよそ１０００年前の出来事である。　\n　\n　後の世、人々は、セイヴァード・カーンを建国の英雄、先帝などと呼んだが、その英雄の傍らには、いつももう一人の英雄がいたことを、今では誰も覚えていない。\n　ヴィルガンディリア\n　ただ、水晶の森で長いあいだ止まっていた彼の時は、確かに動き始めていた。\n\n\nSUSANS Continental Era — Year −22\n\n\n\n\n\n\n"},{"id":"page-toc-8","text":"第二節　セイヴァード\n \n大陸暦０年――人間の王国アクトマイス、初代の王“セイヴァード・カーン”、大陸に跋扈していたエル・ジーザス教――時の神“スセオーンス”を信奉する者たち――を駆逐し、初めて大陸に人間の国を興す。\n\n\n　セイヴァードが、水晶の森で不老の男、ヴィルガンディリアと出会ってから、既に２０年ほどの時が経過してきた。\n　二人の戦いはエル・ジーザスとのものが主であったが、人間の国を築くためには、それだけでは足りなかった。各地に巣食うモンスターの討伐、異種族との調停、人間同士の争いの裁定――やらなければならないことは、いくらでもあった。\n　ヴィルガンディリアは、初めて森で出会ったときから変わらず、常にセイヴァードの背後を守り、彼の知らない多くの知恵を授けてくれた。特に南の山地に住む竜族の王との交渉は、ヴィルガンディリアがいなければ何一つ進まなかっただろう。なにより彼は、野心も欲望も見せることなく、ただセイヴァードの傍らに立ち、彼の成そうとすることを支え続けた。\n　彼と出会わなかったら、この偉業は到底なし得なかったに違いない。\n  ヴィルガンディリア――人間たちは、いつしか彼を“ビルガン・デュラク”と呼ぶようになっていた。もとはといえば、出会ったばかりの頃、セイヴァードが彼のエルフ語をうまく聞き取れなかったことから生まれた名だった。ヴィルガンディリアはあえて訂正しようとはせず、むしろセイヴァードがつけたその呼び名を、いつしか好んで受け入れるようになっていた。\n　そして人間の国が興ったあとも、ビルガンは水晶の森へ帰らなかった。\n　国を建てたとはいっても、エル・ジーザスはなお各地に残っており、まだ平和が訪れたとはいえない。セイヴァードは頼りになる仲間として、ビルガンにこの国へ残っていてほしかった。だが、それ以上に――２０年という歳月を共に過ごした彼を、もはや家族のように感じていた。離れたくなかったのだ。\nセイヴァードはすでに四十八歳になっており、建国の三年ほど前には一人の娘を授かっていた。それでも、多忙な日々を送る彼の傍らに最も長くいたのは、本当の家族よりも、むしろビルガンの方だった。\n\n　＊\n\n　５０歳をいくつか過ぎた頃、セイヴァードは、恐る恐る尋ねた。\n「ビルガン……いつまでここにいてくれるんだ？」\n　水晶の森で出会ってから、すでに２５年以上が経っている。それでも、ビルガンの姿はあの頃とほとんど変わっていなかった。長命なエルフたちからさえ“不老の男”と呼ばれているのだから、それも当然なのかもしれない。それでも実際に目の当たりにすると、やはり奇妙なものだった。\n　対して、セイヴァードの目尻には年齢相応の皺が刻まれ始め、髪にも白いものが混じるようになっていた。\n（やれやれ……いつの間にか、こちらの方が先に歳をとってしまったようだ……）\n　そもそもヴィルガンディリアの本当の年齢など知らないのだから、どれほど時が経ったところで二人の年齢が逆転するはずもない。それでも、少なくとも見た目だけなら、そう思わずにはいられなかった。セイヴァードは、ビルガンの目に今の自分がどう映っているのかを思い、内心でため息をついた。\n「そろそろ森に帰ったらどうか、という私への提案か？」\n　珍しく不安げな顔をして、神妙に尋ねてくるセイヴァードの不安を見透かしたのか、目の前の若い友人は冗談めかして言った。\n「確かに、エル・ジーザスはおおよそ壊滅させた。でも、戦乱の火種はいまだ各地に残っている。まだおまえの力が必要なんだよ、出て行かれたら困るな」\n　真面目な顔をして期待していた言葉を返したセイヴァードに、ヴィルガンは微笑んだ。\n「君が望んでくれる限り、私はいつまでもここにいるつもりだ」\n　その言葉を聞いて、セイヴァードの表情がようやく明るくなった。\n「ならば、いつまでもいて欲しい。幸い――」\n　セイヴァードはふと振り向いた。その先では、幼い娘が静かに眠っていた。\n「幸い――娘も、お前によく懐いている」\n　ヴィルガンディリアもまた、眠る幼子へ優しげな銀色の眼差しを向けた。\n　そこにはもう、水晶の森で孤独に時を過ごしていた、かつての男はいなかった。\n\n　＊\n\n　ヴィルガンディリアは、セイヴァードに告げた言葉通り、王国建立後も彼を補佐し、時には各地の戦乱を鎮めるため、軍を率いてセイヴァードと共に遠征した。\n　やがて戦乱が収まってくるにつれ、彼の役割は、セイヴァードの娘――創造神アルヴァーダインに因んで名づけられたアルヴァード・ソーシャを育てることへと、少しずつ比重を移していった。剣、弓、馬術、地理、歴史、言語、天文……ヴィルガンは、自らの知るあらゆることを彼女に教えた。\n　そして、アルヴァードが十分に剣を振るえる年齢になると、ヴィルガンは彼女を戦場へ伴い、ときには自らに代わって兵を指揮させることさえあった。父セイヴァードから戦士としての才を受け継いだ彼女は、戦うことにも、人を率いることにも、早くから並外れた素質を見せていた。\n\n　王国建立から１０年あまりが経ち、セイヴァードも６０歳に近づく頃には、自ら剣を振るう機会も少なくなり、国政に携わる時間の方が長くなっていた。代わって戦場へ赴くようになったのは、主にビルガンと、成長したアルヴァードだった。まだ１０代半ばでありながら、アルヴァードはすでに戦場で目覚ましい働きを見せており、その姿に、セイヴァードはかつての自分を重ねることもあった。\n　深紅の鎧をまとい、美しい黒髪を靡かせながら勇猛果敢に戦うその姿を、兵士たちはいつしか勝利の女神のように仰ぐようになった。そして、ヴィルガンが守る背中もまた、いつしかセイヴァードのものから、その紅の戦士アルヴァードのものへと変わっていた。\n\n\n　＊\n\n　セイヴァードがビルガンと出会った頃、ともに水晶の森で戦った仲間たちも、３０年以上の時を経て、一人、また一人とこの世を去っていった。王国の中にも、建国に至るまでヴィルガンがどれほど大きな役割を果たしたのかを知らない者が、いつしか増えていた。\n　臣下たちの中には、歳月を経ても一向に老いることなく、武にも知にも秀でたこの男を危険視し、王国から遠ざけるようセイヴァードに進言する者さえ現れた。だが、セイヴァードはそのような言葉には一切耳を貸さなかった。\n　一方で、ビルガン自身も周囲の変化には気づいているようだった。以前にも増して人前に出ることを避け、王宮でも目立たぬよう、慎重に振る舞うことが多くなっていた。\n\n　そんなある日、セイヴァードは人目を避けるように、ビルガンを自室へ呼び出した。久しぶりに二人きりで向き合った友の表情からは、かつての明るさが失われているように感じられた。 \n（ここでの暮らしは、もうこの男には窮屈すぎるのかもしれない……このままでは、いずれ自分のもとからいなくなってしまうかもしれない）\n　セイヴァードはしばらく言葉を探したあと、静かに切り出した。\n「この大陸は広い。一つの国だけで、俺一人が護っていくのには限界がある。だから、いずれはいくつかの国に分け、それぞれの王に統治を任せるのはどうだろうか？」\n　ビルガンの表情からその反応をうかがいながら続けた。\n「そして、その国の一つを、お前に任せたい。」\n　唐突な提案に、ビルガンはすぐには答えなかった。\n「私は、そんなことは望んでいない……君なら、よく分かっていると思うが」\n　やがてビルガンは、セイヴァードの顔をまっすぐに見つめた。その視線が、自分の顔に刻まれた深い皺や、半分以上が白くなった髪に注がれているような気がした。出会った頃にはほとんど同じだった背丈も、今では自分の方がわずかに小さくなっている。\n「歳をとったのだな……セイヴァード」\n「あれから３０年以上経った……仕方のないことだ。人間である俺にとって、３０年という時間はとても長い」\n　セイヴァードはビルガンの視線から逃れるように顔をそむけた。\n「もう俺も、自分の終わりを見ながら行動しないといけない。安心して後を託せるのは、おまえしかいない」\n　ビルガンはただ黙っていた。\n「子供たちはまだ未熟すぎる。おまえしか――」\n「国を分けるのは、よい考えだと思う」\n　ビルガンがその言葉を遮った。\n「王たちの王となり、ここからそれぞれの国を束ねるのがいいだろう。だが――当然だが、私に人間の国の王などできない」\n　そして、少し間を置いて続けた。\n「それに、アルには……アルヴァードには、私のすべてを教えた。いずれ、この国を背負うに相応しい人間になるはずだ」\n「では、俺の代わりにアルヴァードを支えてやってくれないか」\n　セイヴァードは嘆願するようにビルガンを見つめた。かつて戦場で響き渡った声も、今では少しかすれていた。\n「アルヴァードを……？」\n　セイヴァードはうなずいた。\n「娘が生まれた時から、おまえはずっと一緒だった……おまえがこれからも傍にいてくれれば、いずれこの国を背負うに相応しい女王になるだろう……そして俺は……いずれ……」\n　そのとき、セイヴァードには、自分を見つめるビルガンの表情が一瞬だけ苦痛に歪んだように見えた。\n　ビルガンはそれ以上、何も言わなかった。\n　そして、そのまま部屋を出ていった。\n\n　そして、セイヴァードが恐れていた予感は、現実となった。\n　そのしばらく後、ビルガン・デュラクはセイヴァードの国から姿を消した。何も言わず、何も残すことなく。\n　大陸暦１７年――セイヴァードが国を興してから１７年。セイヴァードは６５歳、アルヴァードは２０歳になっていた。\n　\n　＊\n \n　老いたるセイヴァード帝の前に、輝く光をまとった一組の男女が現れた。\n　セイヴァードは、その二人を知っていた。若かりし頃――水晶の森でヴィルガンディリアと出会うよりも、さらに昔――彼らと一度、会ったことがあった。\n　数年前から、再びエル・ジーザスたちが勢いを盛り返していることは、各地から届く報告によってセイヴァードも知っていた。\n\n「スセオーンスが、この世界で宿るための器を見つけ、実体を得ようとしています。彼がこの世界に降り立てば、時に支配されるマテリアル・プレーン――物質界の住民であるあなた達に、勝ち目はありません」\n　最初に口を開いたのは、若い女の方だった。まとった光に遮られてその顔まではよく見えなかったが、セイヴァードはその声を覚えていた。\n　アルテミシャ・ルーア――光と運命を司る女神。\n「おまえのよく知る男、ビルガン・デュラクを器として……」\n　今度は男が告げた。その声にも覚えがあった。アポロン・ダイス――アルテミシャと同じく、光と運命を司る神。\n　ビルガン・デュラク。\n　その名を聞いた瞬間、セイヴァードは驚愕のあまり意識が遠のくのを感じた。\n　何十年も――自分の一生のほとんどをかけて、共にエル・ジーザスと戦ってきた盟友。その男が、なぜ今になって敵であるエル・ジーザスと関わっているのか。ましてや、スセオーンスの器になるとは、いったいどういうことなのか。\n　何一つ、理解できなかった。\n\n「スセオーンスの意思をその身に宿し、時の力を操ろうとしている彼を止めるには、お前はやや老いすぎました。お前の子の身体を借り、我らの力をもってスセオーンスを封じます」\n「子……？」\n　そう問い返しながらも、彼らのいう“子”が誰を指しているのか、セイヴァードには分かっていた。しかし――受け入れることはできなかった。\n　アポロン・ダイスが、ゆっくりとうなずいた。\n「すべての母、アルヴァーダインの御名を授かった、お前の娘だ」\n　老いたセイヴァード帝の顔が暗く歪んだ。\n「あの子に、その使命はあまりにも過酷だ……あの子は、ビルガン・デュラクを慕っている。父として、師として……そして男として」\n　自分の人生の大半を支え続けてくれた親愛なる友と、その友を愛する娘。その二人が殺し合うことになるなど、セイヴァードにはあまりにも辛いことだった。\n\n　そんなセイヴァードに、女神は優しく語りかけた。\n「あの子なら大丈夫。己の使命を全うするでしょう」\n「さあ、おまえがかつてエル・ジーザスを退けるため、アルヴァーダインより授かった神剣サルヴァドゥを、娘に渡すのだ。神の力を宿した肉体は、神の剣でなければ斬ることはできぬ」\n　アポロン・ダイスが視線を向けた。\n　玉座の後ろには、一振りの剣が鞘に収められたまま飾られていた。かつて幾度となくセイヴァードと共に戦場を駆けたその剣も、すでに何年ものあいだ抜かれてはいない。\n　そのとき、剣がひとりでに鞘から抜けた。\n　セイヴァードは目を見開いた。神剣サー・アルヴァーディの刀身が、青白い光を放っていた。長くこの剣を振るってきたセイヴァードでさえ、その光を見るのは初めてだった。\n　アポロン・ダイスが、クイっとわずかに手招きした。青白く輝く神剣は宙を舞い、回転しながらセイヴァードの前へ飛来すると、二柱の神と老王を隔てるように床へ深々と突き立った。\n\n「かつてアルヴァーダインと交わしたおまえの血の盟約は、おまえの娘にも引き継がれる。その剣を娘に託し、スセオーンスを封じよ。奴が完全にこの世界へ降り立つ前に」\n　\n　セイヴァードは、目の前の床に突き立ったサー・アルヴァーディを見つめていた。若かりしとき神々より託されたこの剣を、今度は、娘に渡さなければならない。 \n　青白い光が、老いたセイヴァードの顔を静かに照らしていた。\n\n\nSUSANS Continental Era Year 17\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"id":"page-toc-9","text":"第三節　アルヴァード\n \n　大陸暦１７年。\n　アルヴァードは、自室に閉じこもったまま、もう何日も姿を見せていなかった。\n　ある日、ビルガン・デュラクが突然、彼女の前から姿を消してしまったのだ。\n　ビルガンは、アルヴァードが生まれたときから、ずっとそばにいた。幼い頃に母を亡くし、英雄王として多忙な父とも過ごす時間が限られていた彼女にとって、ビルガンは誰よりも身近な存在であり、自分を育て、導いてくれた師でもあった。\n　そして、老いていく父とは対照的に、ビルガンはいつまでも若々しく、美しい男だった。長い金髪にはところどころ黒髪が混じり、それが自分の髪と似ていることを、アルヴァードは密かに嬉しく思っていた。どんなときでも冷静で、長い年月を生き、数多くのものを見てきたかのような叡智をたたえた銀色の瞳。王の娘として多くの人々に囲まれて育ったアルヴァードにとっても、彼は特別な存在だった。だが、そんな思いを表に出すことはなく、彼の教えに従う従順な生徒として振る舞ってきた。\n　そんなビルガンが自分に向ける眼差しは、いつも優しかった。娘に向けるような、妹に向けるような、あるいは親しい友人に向けるような……その温かな眼差しの中に、アルヴァードは自分がどのような存在として映っているのか、答えを見つけられずにいた。\n　アルヴァードが２０歳を迎えようとしていた、そんな矢先のことだった。何の前触れもなくビルガンが姿を消し、彼女の日常は一変した。自分が何か気に障ることを言ったのだろうか。それとも、知らず知らずのうちに彼を傷つけてしまったのだろうか。何度も過去の言葉や出来事を思い返し、自分を責めた。だが、どれほど考えても、その理由は見つからなかった。\n\n　だが、いつまでも部屋に閉じこもっているわけにはいかなかった。父は確実に老い、母の異なる弟はまだ幼い。父が築き上げたこの王国を、これからは自分が護っていかなければならない。そのことは、誰よりもアルヴァード自身がよくわかっていた。\n　\n　いつか必ず、戻ってくる。\n\n　その願いを胸に、アルヴァードは前に進むことを決意し、彼女を象徴する紅の鎧をまとい、静かに扉を開けた。いつまでも、悲しんではいられないのだ。\n　だが、１年待っても２年待っても――５年の歳月が過ぎても、ビルガン・デュラクが王国に戻ることはなかった。あれほど長い間そばにいたのに、感謝の言葉さえ、そして何より、自分の本当の気持ちを伝えることができなかった。次に会えたなら、必ず……。彼女はビルガンがいつか戻ってくると信じていた。いや、信じるしかなかった。\n\n　その間にも、王国を脅かすエル・ジーザスの残党たちの動きは活発になり、アルヴァードは彼らとの戦いのために大陸中を駆け回っていた。剣を振るい、戦場を駆け抜けている間だけは、何も考えずに済んだ。むしろ、そうしている方が気が晴れた。\n\n　英雄王セイヴァードの血を引き、ビルガン・デュラクに師事してきた紅の戦士アルヴァードもまた、他に類を見ない稀代の勇者へと成長していた。かつて父がそうであったように、彼女は自ら剣を取り、戦場の先頭に立ち続けた。人々はそんな彼女を、英雄王の娘としてだけではなく、一人の英雄として敬い、慕うようになっていた。\n　\n＊\n\n　大陸歴２２年、すなわちセイヴァードがこの大陸に国を建ててから２２年が経過していた。\n　この５年間で、セイヴァードはかつてビルガンに語った統治の構想を実現させていた。広大な大陸を３つの王国に分け、それぞれに王を置き、その上に立つ皇帝が全体を統治するという帝国の仕組みである。３人の王には、長年苦楽を共にしてきた信頼のおける仲間たちを選んだ。こうしてセイヴァードは帝国の初代皇帝となり、後の世に先帝と呼ばれる存在となった。\n\n　ある日、アルヴァードは父の私室に呼ばれた。セイヴァードはすでに７０歳を迎え、アルヴァードは２５歳になっていた。父の顔には深い皺が刻まれ、かつての若々しさは失われていたが、幾多の戦場を駆け抜けてきたその背筋は、今もまっすぐに伸びていた。アルヴァードにとって、いつまでも誇らしい父だった。\n「ソーシャ、よく来たな。今日は大切な話がある」\n　セイヴァードは娘に椅子を勧め、自らもゆっくりと腰を下ろした。\n「おまえに譲らねばならんものがある」\n　その言葉に、アルヴァードは嫌な予感がした。まさか、帝位を譲るつもりでは……そんなものは真っ平ごめんだった。政や法律、経済といった面倒なことは、優秀な重臣たちや、いずれ成長する弟に任せればいい。自分には剣がある。戦士として戦場に立ち続けることこそ、自分にふさわしい生き方だと思っていた。\n　しかし、そんな娘の懸念をよそに、セイヴァードが差し出したのは一本の剣だった。\n「……これは……」\n　アルヴァードには見覚えがあった。父が長年身に帯び、幾多の戦場で振るってきた剣である。神々から授けられた聖剣だという噂は聞いていたが、父がそれを手放す日が来るとは思ってもみなかった。\n「それは、わしが若い頃……今のおまえよりもずっと若い頃、エル・ジーザスを討伐するために神々から託された神剣だ」\n\n　そのとき、アルヴァードは部屋の中に別の気配があることに気づいた。人払いをしていたはずの父の私室に、いつの間にか二人の人物が立っている。反射的に椅子から立ち上がり、身構えた。だが、不思議と敵意は感じられなかった。二人の姿は淡い光をまとい、その佇まいには、思わず息を呑むほどの神々しさがあった。\n「サー・アルヴァーディ。すべての母たるアルヴァーダインの力が秘められし剣」\n　セイヴァードの背後に立つ二人のうち、男の方が静かに告げた。アルヴァーダイン――その名は、アルヴァード自身の名前の由来となった創造神のものだった。\n「サーアルヴァディ……」\n　アルヴァードは、初めて耳にする神剣の名を小さく繰り返した。\n\n「神々との約束を、おまえに引き継がなくてはならない」\n　父の話は、まるで御伽噺のようだった。だが、目の前には神々しく光る聖剣があり、父の背後には淡い光をまとった二人の人物が立っている。到底、ただの作り話とは思えなかった。\n　とはいえ、父はもう長い間、戦場に出ていない。エル・ジーザスとの戦いも、今ではすべて自分が指揮している。今さら何を引き継ぐというのだろう。そんな思いが頭をよぎったが、アルヴァードは老いた父を気遣い、穏やかに答えた。 \n「これからのエル・ジーザスとの戦いは、すべて私が引き受けます。父上はもう、そのようなことをお気になさらぬように……」\n　そのとき、父の背後から静かな声が響いた。\n「これからの戦いは、今までとは違う。スセオーンスは、この世界に自らの器となる者を見つけ、実体を持って降臨しようとしているのだ」\n　先ほど神剣の名を告げた男だった。\n　セイヴァードの背後に立っていた二人が、静かに前へ進み出た。淡い光をまとったその姿を見つめながら、アルヴァードは彼らがこの世界の者ではないことを、すでに感じ取っていた。\n　――まさか、神々なのか……。\n「彼らこそ、わしにこの剣を託した神々だ」\n　まるでアルヴァードの心を読んだかのように、セイヴァードが告げた。\n　壮年の男神と、その傍らに立つ若い女神が、交互に語り始めた。\n「時の神スセオーンスは、ビルガン・デュラクの力を借り、この世界に降臨しようとしている」\n「スセオーンスは、この世界の生けとし生けるものから信仰を集め、再び私たち神々に戦いを挑もうとしているのです」\n「ビルガン・デュラク……」\n　アルヴァードは、思わずその名を口にしていた。\n　５年間、ずっと探し続けてきた人。いつか必ず戻ってくると信じ、再び会える日を待ち続けてきた人。そのビルガンが、時の神スセオーンスの降臨に関わっているというのか。\n　何かを尋ねようとしたが、言葉が出てこなかった。父も神々も、なお何かを語り続けていたが、その声はもうアルヴァードの耳には届いていなかった。\n\n＊\n　\n　気がつくと、アルヴァードは城を飛び出し、独り水晶の森を歩いていた。\n　父や神々と、どのような言葉を交わして城を出たのか、よく覚えていない。ただ、ビルガン・デュラクがこの森のどこかにいる。その思いだけが、彼女を突き動かしていた。\n　広大な水晶の森は、アルヴァードにとっても未知の場所が多かった。それでも、不思議と進むべき方向がわかるような気がした。木々の間を抜け、道なき道を進んでいくうちに、やがて森の奥に見慣れない建物が姿を現した。\n　森の奥に現れたのは、古びた神殿のような建物だった。その傍らでは、大地が巨大な口を開けたかのように裂け、底の見えない暗黒の穴が広がっていた。穴の縁では木々が根をむき出しにして傾き、今にも闇の中へ飲み込まれそうになっている。その深淵からは黒い煙のようなものが絶え間なく噴き上がり、地の底から響くような不気味な轟音が森を震わせていた。\n　アルヴァードは木陰に身を潜め、神殿の様子をうかがった。やがて、薄暗い入口から数人の男たちが姿を現した。いずれもエル・ジーザスの信徒らしい。その中央には、司祭を思わせる衣をまとった、一人の男がいた。\n　長い金髪が、風に揺れていた。\n　アルヴァードの胸が大きく高鳴った。遠目にも見覚えのある、その立ち姿。見間違えるはずがない。５年間、幾度となく思い浮かべ、もう一度会いたいと願い続けてきた人。\n　ビルガン・デュラクだった。\n\n　気がつけば、アルヴァードは木陰から飛び出していた。周囲のエル・ジーザスたちがこちらを振り向いたが、その姿は目に入らなかった。ただ一人、ビルガン・デュラクだけを見つめていた。\n　そして、彼と目が合った。\n　間違いない。あの銀色の瞳も、懐かしい面影も、記憶の中の彼と何も変わっていない。だが、長い金髪にわずかに混じっていた黒髪が、今は白銀の色に変わっていた。\n　かつて、どれほど年月を重ねても老いることのなかった男。その彼の身に、この５年間で何が起きたというのだろう。\nアルヴァードの姿を認めたビルガンの目が、大きく見開かれた。\n「なぜ……おまえが、ここに……」\n　その声も、記憶の中の彼と変わらなかった。\n　周囲のエル・ジーザスたちが一斉に身構える。アルヴァードには、聞きたいことも、伝えたいことも山ほどあった。だが、いざ目の前にすると、何一つ言葉にならない。敵意に満ちた信徒たちの視線を感じ、反射的に腰の剣を抜いた。たちまち、男たちも武器を構えた。\n「やめろ！」\n　ビルガンの一喝に、信徒たちの動きが止まった。\n　アルヴァードは彼を見つめた。先ほどまで驚きに見開かれていた銀色の瞳が、今は静かに自分を見つめ返している。その眼差しには、幼い頃から幾度となく向けられてきた、あの優しさが残っていた。\n　そのとき、アルヴァードの手にした神剣サーアルヴァディが、突如として強い光を放った。青白い輝きが周囲を照らし、エル・ジーザスの信徒たちの間にどよめきが広がった。\n　ビルガンの表情が変わった。苦しげに顔を歪め、片手で頭を押さえると、アルヴァードから目を逸らし、よろめくように神殿へと歩き始めた。\n「待って！」\n　思わず呼びかけたが、ビルガンは振り返らなかった。その背中が、神殿の暗がりへと消えていく。\n「あの女を捕らえろ！　あの剣はスセオーンス様を滅ぼす邪悪なる剣だ。必ず奪い取れ！」\n　ビルガンの傍らに控えていた黒いローブの男が叫んだ。次の瞬間、屈強なエル・ジーザスの戦士たちが、アルヴァードに向かって一斉に襲いかかった。\n\n\n　アルヴァードは襲いかかる戦士たちを斬り伏せ、木々の間を縫うように王都へ向かって駆けた。背後からは怒号と足音が迫り、振り返るたびに新たな追っ手が姿を現した。\n　手にした神剣は、なお青白い光を放っていた。しかし、神を斬る力を秘めたその剣も、人間の戦士を相手にする限り、一振りの剣にすぎない。どれほど剣の腕に優れたアルヴァードでも、次々と現れる屈強な戦士たちを、独りで相手にし続けることはできなかった。\n　王都までは、まだ遠い。枝を払い、木の根を飛び越え、幾度も追っ手の刃を退けながら走り続けたが、やがて呼吸は荒くなり、鎧の下を汗が伝い始めた。剣を握る手にも、少しずつ疲労が忍び寄っていた。\n\n　幾度目かの追っ手を退けたとき、アルヴァードの足がもつれた。片膝をつき、剣を地面に突き立てて身体を支える。木々の向こうから、再び武器を手にした男たちが迫ってきた。\n　――ここまでか。\n　そのとき、先頭を走っていた男が突然、前のめりに倒れた。背中には一本の矢が突き立っている。続けざまに放たれた矢が、さらに二人の追っ手を射抜いた。\n　木陰から現れたのは、黒いフードを目深にかぶった男だった。男は弓を捨てると、腰から赤黒い光を帯びた剣を抜き、アルヴァードに迫る戦士たちを瞬く間に斬り伏せた。\n「こっちだ」\n　差し伸べられた手を取ると、男はアルヴァードを引き起こし、そのまま森の奥へ走り出した。彼は森のすべてを知り尽くしているようだった。迷いのない足取りで木々の間を抜け、幾度も方向を変えながら進むうちに、背後の怒号は次第に遠ざかっていった。\n　その手の温もりに、アルヴァードの胸が震えた。幼い頃から、幾度となく自分の手を引いてくれた人。その大きな手を、忘れるはずがなかった。\n\n「ビルガン……」\n　ようやく、その名を呼ぶことができた。\n　５年間、聞きたいことは山ほどあった。なぜ父を裏切ったのか。なぜエル・ジーザスのもとにいるのか。そして何より、なぜ何も告げず、自分の前から姿を消してしまったのか。\n　男は静かにフードを取った。現れたのは、やはりアルヴァードのよく知る顔だった。長い金髪に混じっていた黒髪は、今では白銀に変わっている。かつて老いることを知らなかった彼にも、時は流れたのだろうか。\n　けれど、そんなことはもう、どうでもよかった。\n　口を開こうとしても、言葉にならない。代わりに、一筋の涙がアルヴァードの頬を伝った。ビルガンは何も言わず、ただ静かに彼女を見つめていた。その銀色の瞳に宿る優しさは、幼い頃から何一つ変わっていない。まるで、彼女が口にできずにいる幾つもの問いを、すべてわかっているかのようだった。\n「ソーシャ……」\n　懐かしい声が、静かに彼女の名を呼んだ。\n　アルヴァードは涙を拭い、ビルガンを見上げた。聞きたいことはまだ何一つ聞けていない。けれど、彼が何かを話してくれるのなら、今はただ、その言葉を待ちたかった。\n「私のもとに来い」\n　思いがけない言葉に、アルヴァードは目を見開いた。\n「スセオーンスのもとへ」\n　その声には、先ほどまでの温かさがなかった。銀色の瞳は変わらず彼女を見つめているのに、そこに宿る光が、ふと冷たくなったように感じられた。\n　ビルガンは背を向けた。\n「……やはり、父を裏切るのですか。あれほど長く共に戦い、強い絆で結ばれていたはずの父を……」\n　ビルガンは足を止めた。背を向けたまま、しばらく何も言わなかった。\n「私は、セイヴァードの言う国の統治とやらには、何の興味もない」\n　それは、かつて父と共に戦い、アルヴァードを育ててくれた男の言葉とは思えなかった。\n　ビルガンは再び歩き出した。アルヴァードは追いかけようとしたが、足が動かなかった。\n「私のもとへ来い……待っている」\n　最後にそれだけを残し、彼の姿は木々の向こうへ消えていった。\n　アルヴァードはしばらく、その場に立ち尽くしていた。腰に佩いた神剣サーアルヴァディが、先ほどよりも強い光を放っていることに気づいたのは、それからだった。\n\n＊\n\n　アルヴァードが城に戻ると、王都は騒然としていた。城門をくぐるなり、駆け寄ってきた兵士から告げられたのは、信じがたい知らせだった。\n　彼女の行方を追って自ら水晶の森へ入ったセイヴァードが、エル・ジーザスの奇襲を受け、重傷を負ったというのだ。\n　アルヴァードは息を呑んだ。つい先ほどまでビルガンのことばかり考えていた自分を、激しい後悔が襲った。\n　急いで自室へ戻り、血と泥に汚れた紅の鎧を脱ぐと、着替えもそこそこに父の寝室へ向かった。\n　扉を開けると、寝台に横たわるセイヴァードの姿が目に飛び込んできた。幾度となく戦場で先頭に立ち、どんな傷を負っても笑っていた父が、今は青白い顔で静かに横たわっている。\n「父上……私の身勝手で、こんなことに……」\n　アルヴァードは寝台の傍らに膝をつき、父の手をそっと握った。\n　皺に覆われ、すっかり細くなった父の手。幼い頃、何度も自分を抱き上げ、剣の握り方を教えてくれた、あの大きく力強い手が、今はこんなにも小さく感じられた。\n　セイヴァードはゆっくりと顔を向け、娘を見つめた。\n「はは……気に病むことはない。お前のおかげで、最後にもう一度、戦士として剣を振るうことができた。王様なんかしているより、こっちの方がよほど俺に似合っている」\n　弱々しい声だった。それでも、口元に浮かんだ笑みは、アルヴァードが幼い頃から見慣れた父のものだった。\n「あいつと会ったのか？」\n　不意にそう尋ねられ、アルヴァードは顔を上げた。父が誰のことを言っているのか、聞き返す必要はなかった。\n　彼女が小さくうなずくと、セイヴァードは天井を見上げ、深いため息をついた。\n「あいつのことは……誰よりも俺が一番よくわかっているという自信があった。だが、最後はあいつのことがわからなくなってしまったな……」\n　セイヴァードは天井を見つめたまま、しばらく黙っていた。\n「人の心というのは、結局、本人でなければわからないものよ」\n　そう言って小さく息をついたが、やがて苦しそうに咳き込んだ。アルヴァードが身を乗り出すと、父は大丈夫だと言うように、かすかに手を動かした。\n「いや……俺のような普通の人間が、あいつの心を推し量ろうとしたのが間違いだったのかもしれんな。この国は、あいつにはさぞ窮屈だったろう。いつまでもここに繋ぎ止めようとして、随分と申し訳ないことをしたものだ」\n　アルヴァードは何も言えなかった。常に明るく、太陽のような力強い笑顔を見せてきた父の顔が、今は深い後悔に歪んでいた。\n「俺は……あいつに甘えすぎていた。自分のやりたいことばかり話して、あいつが何を大切に思い、何をしたかったのか、もっと耳を傾けるべきだった」\n　セイヴァードはゆっくりと娘の方へ顔を向けた。その目には、いつもの力強さとは違う、静かな寂しさが浮かんでいた。\n\n「その剣は……俺がまだ若かった頃、スセオーンスを信奉するエル・ジーザスを討つために、神々から託されたものだ」\n　セイヴァードの視線が、アルヴァードの腰に佩かれた神剣へと向けられた。\n「俺の旅は、そこから始まった。あいつと出会い、共に戦い、幾つもの国を巡った……。長い旅だったな」\n　懐かしむように、セイヴァードの口元にかすかな笑みが浮かんだ。\n「エル・ジーザスを討ち、スセオーンスの復活を阻むこと。それが神々から与えられた俺の宿命だった。そして、その使命は、お前にも引き継がれている。その剣を振るうことができるのは、アルヴァーダインと盟約を交わした俺の血を引く者だけだ」\n　アルヴァードは腰の神剣に目を落とした。鞘に収められたサーアルヴァディは、なおも青白い光を放ち続けていた。\n　彼女は再び父を見つめた。セイヴァードの表情からは、先ほど浮かんでいた笑みが消えていた。\n「そして……俺は、お前にも悪いことをした」\n　セイヴァードは言葉を切り、娘の顔をじっと見つめた。\n「こんなことになってしまって……すまない……」\n　そのとき、父の目尻から一筋の涙がこぼれ、深い皺を伝って流れ落ちた。\n　アルヴァードは息を呑んだ。父の涙を見るのは、おそらく生まれて初めてのことだった。どれほど苦しい戦いの後でも、どれほど深い傷を負っても、父はいつも笑っていた。その父が、今、自分の目の前で涙を流している。とっくに枯れ果てたであろう涙を。\n「すまない……ソーシャ……」\n　かすれた声で、父はもう一度謝った。\n　アルヴァードは初め、その涙の意味がわからなかった。けれど、父の手を握りながら、ようやく悟った。\n　父は知っていたのだ。自分がビルガンをどれほど慕い、愛してきたのかを。そして、その相手を斬るという残酷な宿命を、ほかならぬ自分の娘に背負わせなければならないことを。\n　セイヴァードの涙は、そんな娘に向けられた、父としての贖罪の涙だった。\n　アルヴァードの目からも、大粒の涙がこぼれた。\n「これが宿命であるならば、私はそれを受け入れます」\n　涙を流しながら、アルヴァードは父の手を強く握った。\n　セイヴァードは娘を見つめ、かすかに微笑んだ。そして、残された力を振り絞るように、その手を握り返した。\n　やがて、握り返していた力が静かに失われていった。\n　セイヴァードは、そのまま息を引き取った。\n\n　＊\n\n　母違いの弟は、まだ幼い。しかし、セイヴァードが築き上げた帝国には、父が自ら選び出した３人の優れた王がいる。たとえ自分が戻らなくとも、彼らがこの国を護ってくれるだろう。\n　アルヴァードは再び紅の鎧に身を包んだ。\n　もう一度、あの神殿へ行かなければならない。そして、あの男に会わなければならない。\n\n　夜も更け、城内が静まり返った頃、アルヴァードは人知れず城を出ようとした。\n「お待ちなさい」\n　不意に声がした。\n　足を止めたアルヴァードの前に、二つの光が現れた。光は次第に人の姿を取り、輝きをまとった一組の男女となって彼女の前に立った。\n　アルヴァードには、その姿に見覚えがあった。\n　光と運命を司る兄妹神、アポロン・ダイスとアルテミシャ・ルーア。かつて父から神剣サーアルヴァディを受け継いだときにも、二柱はそこにいたのだ。\n「あなたは、ビルガン・デュラクのもとへ行くのですね？」\n　アルテミシャの問いに、アルヴァードは静かにうなずいた。\n「それは、彼を倒すために……？　それとも……彼と共に生きるために……？」\n　アルヴァードは答えず、腰に佩いた神剣へと視線を落とした。鞘の中では、サーアルヴァディが青白い光を放っている。\n　しばらくして、彼女は顔を上げた。\n「神々よ。それはもちろん、アルヴァーダインの御心に従い、スセオーンスの復活を阻止するためです」\n　兄妹神は互いに顔を見合わせ、静かにうなずいた。やがて、妹のアルテミシャが一歩前へ進み、アルヴァードに手を差し伸べた。\n「ならば、私たちもあなたに力を貸しましょう」\n　アルテミシャの差し伸べた手が、柔らかな光を帯びた。\n「その神を斬る剣だけでは、スセオーンスの時の技を防ぐことはできません。限られた時しか生きられない人間にとって、時の技は恐るべき力なのです」\n　アルヴァードは神剣を握る自分の手に目を落とした。\n「私があなたを器として、その身体を借りましょう。あなたが剣を振るい、私が時の技からあなたを護る。そうして、共に戦うのです」\n　アルヴァードはアルテミシャを見つめた。そして、差し伸べられた女神の手に、自らの手を重ねた。　\n\n　＊\n\n　光と運命の女神アルテミシャ・ルーアを身に宿したアルヴァードは、独り水晶の森の奥へと向かった。\n　夜の森は深い闇に包まれていたが、不思議と道に迷うことはなかった。行くべき方角が、まるで以前から知っていた道のように、自然と頭の中に浮かんでくる。アルテミシャが導いているのだろう。\n　やがて、夜明けを迎えるよりも早く、アルヴァードはあの神殿へとたどり着いた。\n　だが、目の前の光景は、先日訪れたときとは大きく変わっていた。\n　神殿の脇に口を開けていた暗黒の穴は、さらに大きく広がり、その縁は建物の一部にまで達していた。石造りの壁は崩れ、かつて神殿を支えていた柱の幾本かが、暗闇の中へと傾いている。\n\n　周囲にエル・ジーザスの戦士たちの姿は、ほとんど見当たらなかった。\n　スセオーンスの復活が近づいているのだろうか。もはや、この神殿を守る必要すらなくなったのかもしれない。\n　それとも、ビルガンはすでにここを去ってしまったのだろうか。\n　そう思ったとき、不意に頭の中で声が響いた。\n（彼は、あの神殿の中にいます）\n　アルテミシャの声だった。\n　アルヴァードは崩れかけた神殿を見上げると、神剣の柄に手を添え、静かにその入口へと歩き出した。\n　女神の言葉に従い、アルヴァードは、スセオーンスの神殿に足を踏み入れた。\n　崩れた天井からは夜空がのぞき、床には砕けた石片が散乱していた。かつて整然と並んでいたであろう柱も幾本かが倒れ、神殿の奥へと続く通路を塞いでいる。\n　その先に、彼はいた。\n　奥の玉座に腰を下ろしたビルガン・デュラク。その周囲には、数名のエル・ジーザスの戦士が、彼を護るように立っていた。\n「待っていたぞ……アルヴァード・ソーシャ……」\n　玉座から響いた声に、アルヴァードは足を止めた。\n　ビルガンの眼差しは、先日会ったときよりも暗く、どこか苦痛に歪んでいるように見えた。そして、不思議なことに、その長い金髪には、かつてのように黒い髪が混じっていた。\n　まるで、若い頃の姿へ戻りつつあるかのようだった。スセオーンスの器になったというビルガン。その身体が、今どれほど時の神に侵されているのか、彼女にはわからなかった。\n（もう、スセオーンスの一部が彼の身体の中にいるのを感じます）\n　頭の中に、アルテミシャの警告が響いた。\n\n「私と共に……スセオーンスに従うのだ、アル。永遠に……」\n　ビルガンは玉座に座ったまま、アルヴァードへ片手を差し伸べた。\n　アルヴァードは静かに首を横に振り、腰から神剣を抜いた。\n　サーアルヴァディの刀身から青白い光があふれ、薄暗い神殿の隅々まで照らし出す。その光の中で、ビルガンの玉座の背後に、怪しげな黒い影が揺らめいた。\n　ビルガンは光を浴び、苦しげに顔を歪めた。\n「スセオーンスに操られているあなたを、私が解放する」\n　その言葉が終わるや否や、ビルガンを護っていたエル・ジーザスの戦士たちが、一斉にアルヴァードへ襲いかかった。\n　アルヴァードは踏み込みざまに一人の剣を弾き、返す刃でもう一人を斬り伏せた。背後から迫る敵の気配に身をひるがえし、振り下ろされた剣をかわすと、そのまま残る戦士たちを次々と倒していった。\n　やがて、彼女と玉座の間を遮る者はいなくなった。\n　ビルガン・デュラクはゆっくりと立ち上がり、腰に佩いていた剣を抜いた。\n「おまえに、私は倒せないぞ。ソーシャ……」\n　その手に握られた魔剣デュロイザークが、サーアルヴァディの青白い光に呼応するように、赤黒い輝きを放ち始めた。\n　アルヴァードは神剣を構え直した。かつて幾度となく剣を教わった師が、今、目の前に立っている。\n（気をつけなさい。あれはスセオーンスの力を宿した神剣デュロイザーク。あの剣を使って、彼は時の技を操ることが……）\n　アルテミシャの言葉が終わるよりも早く、二人の剣が激しくぶつかり合った。\n「スセオーンスの復活を妨げる者は、誰であれ排除する」\n　ビルガンの言葉とともに、赤黒い刃がアルヴァードへ迫った。\n　アルヴァードはその一撃を受け流し、すかさず反撃に転じた。しかし、ビルガンは彼女の剣が振り抜かれるよりも早く身を引き、次の一撃を繰り出してくる。\n　互いの剣がぶつかるたびに、青白い光と赤黒い光が飛び散り、崩れかけた神殿の壁を照らした。\n　アルヴァードの剣筋を、ビルガンは知り尽くしていた。幼い頃から彼女に剣を教え、その成長を見守ってきたのは、ほかならぬ彼自身なのだ。\n　だが、それはアルヴァードにとっても同じだった。師の構え、踏み込み、剣を振るうときのわずかな癖まで、彼女の身体には深く刻み込まれている。\n　幾度となく剣を交えながら、アルヴァードは少しずつ間合いを詰めていった。かつては一度も勝てなかった師の剣を、今は確かに押し返している。\n　二人の戦いを邪魔するものは、ここには何もない。ただ、神殿には、二人の剣戟だけが響いていた。\n\n　戦いが続くにつれ、アルヴァードの優勢は次第に明らかになっていった。ビルガンは彼女の剣を受け流しながら後退し、やがて大きく間合いを取った。\n　その背後には、神殿の一部を呑み込んだ暗黒の穴が広がっていた。\n　ビルガンは穴の縁へと近づき、しばらくその深淵を見つめた。まるで、そこから何かを得ようとしているかのように。\n　やがて振り返ると、デュロイザークの切っ先をアルヴァードへ向け、低い声で何事かをつぶやいた。\n　その瞬間、アルヴァードは目に見えない何かが自分に迫ってくるのを感じた。それは、風でも、熱でもない。これまで幾多の戦場で経験してきた、どんな力とも違っていた。\n　だが、それが何なのか、彼女にはわからなかった。\n（これこそが、スセオーンスの時の技……）\n　アルテミシャの声が、アルヴァードの頭の中に響いた。\n（あの男は、あなたの身体の時を止めようとしています。この技を受ければ、この世界の住人は誰であろうと、戦うことはおろか、指一本動かすことさえできなくなるのです）\n　アルヴァードはビルガンを見つめた。彼はなおもデュロイザークをこちらへ向け、何事かをつぶやき続けている。\n（この力は、私が引き受けます。あなたは、その剣であの男を……）\n　アルテミシャの言葉が途切れた。\n　同時に、アルヴァードを包もうとしていた得体の知れない力が、ふっと消えた。\n　もう、アルテミシャの声は聞こえてこなかった。\n\n　ビルガンは怪訝そうにアルヴァードを見つめていた。時を止めたはずなのに、彼女は何事もなかったかのように動いている。\n　アルヴァードはその隙を逃さず、サーアルヴァディを手に一気に間合いを詰めた。\n　ビルガンは剣を構えた……が、アルヴァードが突き出した神剣を受け止めようとはしなかった。\n　それどころか、彼は自ら一歩、剣の切っ先へと踏み込んだように見えた。\n　アルヴァードは息を呑んだ。急所を外して突き出したはずの剣が、ビルガンの胸の中心へと吸い込まれていく。\n　青白い刀身が、ビルガンの心臓を貫いた。\n　次の瞬間、崩れかけた神殿に、おぞましい断末魔が響き渡った。\n　それは、明らかに聞き慣れたビルガンの声ではなかった。\n　神を斬る神剣は、ビルガン・デュラクの中に宿っていたスセオーンスの一部を滅したようだった。彼の長い金髪に混じっていた黒髪が、以前会った時のように、少しずつ白く変わっていくのが見えた。\n　アルヴァードは驚いて剣から手を離した。致命傷を避けて剣を突き出したはずだったのに、サーアルヴァディはビルガンの心臓を貫き、今もその胸に突き刺さったままだった。\n　ビルガン・デュラクは神剣で貫かれながら、アルヴァードに視線を向けた。その眼差しは、かつて彼女が知っていた、温かなものだった。\n　そして……その瞳から一筋の涙がこぼれ落ちた。\n　アルヴァードは息を呑んだ。ビルガンの涙を見るのも、生まれて初めてのことだった。\n「すまない……ソーシャ……」\n　父が最期に見せた涙が、そして父の最期の言葉が、脳裏によみがえった。\n「わたしの弱い心は、時の流れに打ち克つことができなかった……」\n　アルヴァードは、ビルガンの白く戻った髪を見つめた。この人ほどの者でも、老いることが怖かったのだろうか。\n「……ソーシャ……おまえをセイヴァードのように失いたくなかった……」\n　アルヴァードは、はっとしてビルガンの顔を見上げた。\n　ビルガンは、胸に突き刺さったサーアルヴァディの柄を握り、自らの身体からゆっくりと引き抜いた。\n　アルヴァードが思わず手を伸ばしたとき、彼の身体はすでに暗黒の穴へと傾いていた。\n　ビルガン・デュラクは、そのまま底知れぬ闇の中へと消えていった。\n\n　アルヴァードはただ、大粒の涙をこぼしながら、その場に崩れ落ちた。　\n\n\n\n大陸暦２３年、紅の聖戦士アルヴァード・ソーシャは、神々の王アルヴァーダインより授けられし聖なる神剣サルヴァドゥにより、スセオーンスの器となったビルガン・デュラクを斬った。\n　その後、彼女はいずこかへ姿を消したが、その理由は明らかではない。ただ、彼女が再びスサンス大陸の歴史の舞台に現れることはなかった。\n\n　このスサンス大陸には、もはやヴィルガンディリアも、セイヴァードも、アルヴァードもいなかった。\n\n\nSUSANS Continental Era Year 23\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n"},{"id":"page-toc-10","text":"第三章　魔法の時代\n\n【この章の登場人物】\n\n\nケル・カイオス：\n\n\n\n\nケル・カイト：当時\n\n\n\n\nカイエル：セイ\n\n\n\n\n\n"},{"id":"page-toc-11","text":"第一節　ケル・カイオス\n\n　大陸歴５５０年－－スサンス大陸の北西に位置する、魔術師達の集うソーサリー島。\n　大魔法使いケル・カイオスは、このソーサリー島の中心に建てられた太陽の塔の最上階の自分の部屋で、新しい魔術の研究に没頭していた。この太陽の塔は、彼が大陸内外から集めた書物で埋め尽くされており、彼に使える多くの司書達が、毎日のようにその整理に追われていた。彼の収集するあらゆるものは、もはや、この塔だけでは収まらなくなり、彼は太陽の塔の周りに、新しい塔を建て始めていた。\n　そんなソーサリー島には、ケル・カイオスが集める多くの知識を求めて、たくさんの魔術師が訪れ、また彼らが新しい知識を残していった。\n　\n　火・水・風・土……多くの魔術師が一生をかけて習得する四元素の魔法はもちろん、様々な概念からなる魔法の研究を彼は行った。\n　そんな魔術師ケル・カイオスは、神々の信仰などとは無縁のように見えたが、実際のところは、創造神アルヴァーダインに仕える敬虔なるものであり、神学についても深い興味を持っていた。そして、アルヴァーダインと同じように、彼もいろいろなものを創造することをこよなく愛していた。\n　貪欲な知識欲、そして創造欲。 とにかく、ありとあらゆるものに興味を持つ彼は、いつも多忙であり時間がなかった。\n　\n　そこに、助けを求める使者がくる。\n　ソーサリー島に接するスサンス大陸のアステラス王国からの使者だ。\n　この頃頻繁にこのソーサリー島にやってくる。力を貸して欲しいと。\n「あながた希望なのです」\n　しかし、魔術の研究に没頭しているケルカイオスは、あまり乗り気ではない。\n　彼はとにかく多忙であった。\n\nあぁ、もう一人自分がいたら……\n彼は何度も思うのだった。\n\n\n"},{"id":"page-toc-12","text":"第二節　ケル・カイト\n\n　煙のようなその存在は、やがて人の姿となり、太陽の塔を駆け巡った。\n彼の集めたあらゆる書、彼が書き留めたあらゆる記述を、何日もかけて読み解き学習していった。\n　スタンドであるAIケルカイオス・ソル！が誕生する。\n　ケル・カイオスでは紛らわしい。\n　カイト（分身）から、ケル・カイトと名付けることにした。\n　自分の分身。\n　　\n　時間がない。そして、時間を遡れたらもっとたくさんの知識を手に入れることができる。\n　いつしか、ケル・カイトはそのような誘惑をケル・カイオスにささやくようになった。\n　時の力・・・\n　しかしその時既に、ケル・カイトは、スセオーンスの精神体である暗黒の魔導士カイエルに操られ始めていたのであった。\n\n\n　\n　暗黒の魔導士に挑むケル・カイオスとケル・カイト。\n　しかし、時の技には勝てない。\n　ケル・カイオスはやむなくソーサリー島へ撤退する。\n\n"},{"id":"page-toc-13","text":"第三節　カイエル\n\n　エル・ジーザスに敗れ滅びゆくアステラス王国。\n　ケル・カイオスは、アステラスの王都を浮かせて逃がす。\n　姫戦士が残した神剣サルヴァドゥ、彼自身は使わないがその剣が持つ力を研究し、神を打ち消す力を編み出す。\n　\n\n　ケル・カイオスは、ケル・カイトと合体し、さらにその彼を器としてアポロン・ダイスが宿る。三体合体で古今東西最強の魔法使いになり、スセオーンスの精神体にして暗黒の魔導士カイエルを倒す。\n\n　だが、その後、ケル・カイオスも姿を消す。誰も彼の姿を見かけることはなかった。\n\n\n\n\n  \n"}],"currentPageIndex":3,"fontSize":19,"fontChoice":"gothic"},"toc":{"entries":[{"id":1,"level":"part","title":"第一部 古の時代","pageId":"page-root","localStart":0,"localEnd":8,"start":0,"end":8,"anchorText":"第一部\t古の時代","headingSize":2,"headingFont":"gothic","headingBold":true,"pageBreak":false},{"id":2,"level":"chapter","title":"第一章 神々の時代","pageId":"page-toc-2","localStart":0,"localEnd":9,"start":10,"end":19,"anchorText":"第一章\t神々の時代","headingSize":1.4,"headingFont":"inherit","headingBold":true,"pageBreak":true},{"id":3,"level":"section","title":"第一節 序","pageId":"page-toc-2","localStart":11,"localEnd":16,"start":21,"end":26,"anchorText":"第一節\t序","headingSize":1.2,"headingFont":"inherit","headingBold":true,"pageBreak":false},{"id":4,"level":"section","title":"第二節 アルヴァーダイン","pageId":"page-toc-4","localStart":0,"localEnd":12,"start":637,"end":649,"anchorText":"第二節　アルヴァーダイン","headingSize":1.2,"headingFont":"inherit","headingBold":true,"pageBreak":true},{"id":5,"level":"section","title":"第三節 スセオーンス","pageId":"page-toc-5","localStart":0,"localEnd":10,"start":2160,"end":2170,"anchorText":"第三節　スセオーンス","headingSize":1.2,"headingFont":"inherit","headingBold":true,"pageBreak":true},{"id":6,"level":"chapter","title":"第二章 英雄たちの時代","pageId":"page-toc-6","localStart":0,"localEnd":11,"start":4654,"end":4665,"anchorText":"第二章\t英雄たちの時代","headingSize
