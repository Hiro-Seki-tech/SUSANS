<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOPERA Reader Step25-1 Bookmark Menu Prototype</title>
<style>
:root{
  --paper:#fffdf8; --ink:#24211d; --sub:#756f66; --line:#d9d2c7;
  --bg:#e9e6df; --accent:#5f5140; --shadow:0 12px 36px rgba(44,38,30,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
button{font:inherit}
.reader-shell{min-height:100vh}
.reader-topbar{
  position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:7px;
  padding:8px max(14px,calc((100vw - 840px)/2));background:rgba(248,246,241,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px)
}
.topbar-main{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-actions{display:flex;gap:8px;align-items:center}
.reader-location{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-top:1px solid rgba(150,140,126,.24);padding-top:6px;color:#6f685f;font-size:13px
}
.reader-location .breadcrumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-location .page-count{flex:0 0 auto}
.ui-btn{
  min-height:38px;border:1px solid #bcb3a6;border-radius:9px;background:#fffdf8;color:#3d372f;
  padding:7px 13px;cursor:pointer
}
.ui-btn:hover{background:#f3efe7}
.ui-btn:disabled{opacity:.42;cursor:default}
.sound-btn.is-on{background:#34302a;color:#fff;border-color:#34302a}
.prototype-badge{font-size:11px;letter-spacing:.08em;color:var(--sub);white-space:nowrap;opacity:.8}
.nopera-reader-brand{font-size:11px;letter-spacing:.08em;color:var(--sub);white-space:nowrap;opacity:.8}
.paper{
  width:min(820px,calc(100% - 28px));min-height:70vh;margin:24px auto 16px;background:var(--paper);
  box-shadow:var(--shadow);border:1px solid rgba(130,117,98,.22);border-radius:3px;
  padding:clamp(30px,6vw,62px) clamp(24px,7vw,72px) clamp(42px,7vw,70px)
}
.story-title{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;text-align:center;font-size:clamp(24px,4vw,34px);margin:0 0 8px}
.story-subtitle{text-align:center;color:var(--sub);margin:0 0 44px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.reading{
  white-space:pre-wrap;overflow-wrap:anywhere;line-height:2.05;font-size:18px;letter-spacing:.025em;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif
}
.reading.gothic{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}
.reading.serif{font-family:Georgia,"Times New Roman","Yu Mincho",serif}
.heading{display:inline}
.ill{display:block;margin:2.1em auto;clear:both}
.ill img{display:block;width:100%;height:auto;border-radius:2px}
.ill[data-align="left"]{float:left;margin:1em 1.5em 1em 0;clear:left}
.ill[data-align="right"]{float:right;margin:1em 0 1em 1.5em;clear:right}
.ill[data-align="center"]{float:none;margin:2.1em auto}
.page-clear{clear:both}
.reader-footer{
  width:min(820px,calc(100% - 28px));margin:0 auto 42px;padding:10px 4px 24px
}
.breadcrumb{color:#6f685f;min-height:18px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.pager .prev{justify-self:start}.pager .next{justify-self:end}
.page-count{font-variant-numeric:tabular-nums;color:#5d564e;white-space:nowrap}
.empty{
  min-height:48vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:#71695f;line-height:1.8
}

.prototype-page-nav{
  position:fixed;left:14px;bottom:14px;z-index:40;display:flex;align-items:center;gap:6px;
  background:rgba(46,42,37,.92);color:#fff;border-radius:999px;padding:6px 8px;
  box-shadow:0 5px 20px rgba(0,0,0,.22);font-size:12px
}
.prototype-page-nav button{
  width:32px;height:30px;border:0;border-radius:999px;background:#fffdf8;color:#2e2a25;
  cursor:pointer;font:inherit;font-size:16px
}
.prototype-page-nav button:disabled{opacity:.35;cursor:default}
.prototype-page-nav span{min-width:58px;text-align:center;white-space:nowrap}

.prototype-loader{
  position:fixed;right:14px;bottom:14px;z-index:40;background:#2e2a25;color:#fff;border:0;border-radius:999px;
  padding:10px 14px;box-shadow:0 5px 20px rgba(0,0,0,.22);cursor:pointer;font-size:13px
}
.toc-backdrop{
  position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:50;display:none;padding:18px
}
.toc-backdrop.open{display:flex;align-items:center;justify-content:center}
.toc-panel{
  width:min(620px,100%);max-height:min(78vh,760px);overflow:auto;background:#fffdf8;border-radius:12px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);padding:20px
}
.toc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:10px}
.toc-head h2{font-size:20px;margin:0;font-family:"Yu Mincho",serif}
.toc-close{border:0;background:transparent;font-size:26px;cursor:pointer;padding:0 7px}
.toc-list{display:flex;flex-direction:column;gap:2px}
.toc-item{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;color:#39342e}
.toc-item:hover{background:#eee9df}
.toc-item.level-1{padding-left:10px;font-weight:700;font-size:1.02em}
.toc-item.level-2{padding-left:34px;font-weight:600}
.toc-item.level-3{padding-left:60px;font-size:.94em;color:#625b52}
.toc-empty{padding:22px 8px;color:#7b746a;text-align:center}

.text-backdrop{
  position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:55;display:none;padding:18px
}
.text-backdrop.open{display:flex;align-items:center;justify-content:center}
.text-panel{
  width:min(480px,100%);max-height:min(82vh,720px);overflow:auto;background:#fffdf8;border-radius:12px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);padding:20px
}
.text-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.text-head h2{font-size:20px;margin:0;font-family:"Yu Mincho",serif}
.text-close{border:0;background:transparent;font-size:26px;cursor:pointer;padding:0 7px}
.setting-group{padding:13px 0;border-bottom:1px solid #e7e1d7}
.setting-group:last-of-type{border-bottom:0}
.setting-label{display:block;font-size:13px;color:#6c655c;margin-bottom:9px}
.setting-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.setting-value{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
.choice-btn.is-selected{background:#34302a;color:#fff;border-color:#34302a}
.reset-row{display:flex;justify-content:flex-end;margin-top:18px}
.reset-btn{background:#f5f0e7}

.bookmark-backdrop{
  position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:58;display:none;padding:18px
}
.bookmark-backdrop.open{display:flex;align-items:center;justify-content:center}
.bookmark-panel{
  width:min(430px,100%);background:#fffdf8;border-radius:12px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);padding:20px
}
.bookmark-head{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px
}
.bookmark-head h2{font-size:20px;margin:0;font-family:"Yu Mincho",serif}
.bookmark-close{border:0;background:transparent;font-size:26px;cursor:pointer;padding:0 7px}
.bookmark-status{margin:0 0 14px;color:#6c655c;font-size:13px;line-height:1.7}
.bookmark-actions{display:grid;gap:9px}
.bookmark-actions .ui-btn{width:100%;text-align:center}
.bookmark-remove{color:#7a3838}

.toast{
  position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;
  background:#292622;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
  .reader-topbar{padding:8px 10px}.prototype-badge{display:none}.nopera-reader-brand{font-size:10px}
  .topbar-main{justify-content:center}.top-actions{width:100%;justify-content:center;gap:6px}
  .top-actions .ui-btn{padding-left:10px;padding-right:10px}
  .reader-location{gap:8px;font-size:12px}
  .paper{width:100%;margin:0;border-left:0;border-right:0;box-shadow:none;padding:30px 20px 42px}
  .story-title{margin-top:6px}.story-subtitle{margin-bottom:34px}
  .reading{font-size:16px;line-height:1.95}
  .reader-footer{width:100%;padding:10px 14px 28px;margin-bottom:54px}
  .ill[data-align="left"],.ill[data-align="right"]{float:none;margin:1.8em auto!important;max-width:100%!important}
  .prototype-loader{right:10px;bottom:10px}
  .prototype-page-nav{left:10px;bottom:10px}
}

/* =========================================================
   Step24: JSON表紙 → 物語をはじめる → BOOK / OPERA → Reader
   Generator Step22 の表紙設定・開始演出をReaderへ接続。
   ========================================================= */
.nopera-cover-gate{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;
  padding:clamp(16px,4vw,42px);background:#11100e;
}
.nopera-cover-gate[hidden],.nopera-start-experience[hidden],.nopera-start-scene[hidden]{display:none!important}
.nopera-cover-stage{
  position:relative;width:min(760px,92vw);height:min(78vh,650px);min-height:420px;
  overflow:hidden;border-radius:10px;box-shadow:0 24px 80px rgba(0,0,0,.52);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(38px,7vw,72px);color:#f3d889;
}
.nopera-cover-stage.is-book{background:var(--nopera-book-cover-color,#173f35)}
.nopera-cover-stage.is-opera{
  background:radial-gradient(circle at 50% 42%,#4b3b2b 0,#17120e 48%,#050505 100%);
}
.nopera-cover-copy{position:relative;z-index:8;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:88%}
.nopera-cover-title{font-weight:900;line-height:1.12;overflow-wrap:anywhere}
.nopera-cover-subtitle{font-size:clamp(14px,2.4vw,20px);line-height:1.5}
.nopera-cover-credits{display:grid;gap:4px;margin-top:8px;font-size:13px;line-height:1.55}
.nopera-cover-start{
  position:relative;z-index:9;margin-top:34px;min-width:180px;padding:11px 18px;
  border:1px solid currentColor;border-radius:999px;background:rgba(0,0,0,.12);
  color:inherit;font-weight:800;cursor:pointer;backdrop-filter:blur(4px)
}
.nopera-cover-start:hover{background:rgba(255,255,255,.10)}
.nopera-book-frame-layer,.nopera-book-frame-inner{position:absolute;pointer-events:none}
.nopera-book-frame-layer{inset:14px;border:1px solid currentColor;border-radius:4px;opacity:.82}
.nopera-book-frame-inner{inset:7px}
.book-frame-double .nopera-book-frame-layer{inset:12px;border:2px solid currentColor;border-radius:5px;opacity:.88}
.book-frame-double .nopera-book-frame-inner{border:1px solid currentColor;border-radius:3px;opacity:.58}
.book-frame-classic .nopera-book-frame-layer{
  inset:11px;border:2px solid currentColor;clip-path:polygon(0 10%,4% 10%,4% 4%,10% 4%,10% 0,90% 0,90% 4%,96% 4%,96% 10%,100% 10%,100% 90%,96% 90%,96% 96%,90% 96%,90% 100%,10% 100%,10% 96%,4% 96%,4% 90%,0 90%);opacity:.9
}
.book-frame-classic .nopera-book-frame-inner{inset:10px;border:1px solid currentColor;border-radius:2px;opacity:.5}
.book-frame-arched .nopera-book-frame-layer{inset:12px;border:2px solid currentColor;border-radius:48% 48% 12px 12px/12% 12% 5% 5%;opacity:.86}
.book-frame-arched .nopera-book-frame-inner{inset:8px;border:1px solid currentColor;border-radius:46% 46% 9px 9px/11% 11% 4% 4%;opacity:.48}
.book-frame-geometric .nopera-book-frame-layer{inset:10px;border:2px solid currentColor;clip-path:polygon(7% 0,93% 0,100% 7%,100% 93%,93% 100%,7% 100%,0 93%,0 7%);opacity:.9}
.book-frame-geometric .nopera-book-frame-inner{inset:9px;border:1px solid currentColor;clip-path:polygon(5% 0,95% 0,100% 5%,100% 95%,95% 100%,5% 100%,0 95%,0 5%);opacity:.5}
.book-frame-japanese .nopera-book-frame-layer{inset:13px 16px;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.78}
.book-frame-japanese .nopera-book-frame-layer::before,.book-frame-japanese .nopera-book-frame-layer::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:currentColor;opacity:.8}
.book-frame-japanese .nopera-book-frame-layer::before{left:9px}.book-frame-japanese .nopera-book-frame-layer::after{right:9px}
.book-frame-japanese .nopera-book-frame-inner{inset:7px 0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.36}
.nopera-cover-curtain{display:none}
.nopera-cover-stage.is-opera .nopera-cover-curtain{
  display:block;position:absolute;top:0;bottom:0;width:53%;z-index:2;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 10px,rgba(0,0,0,.16) 10px 22px),var(--nopera-start-curtain,#741c28);
  border-bottom:5px solid #d6b85f;opacity:.72
}
.nopera-cover-stage.is-opera .nopera-cover-curtain.left{left:0}.nopera-cover-stage.is-opera .nopera-cover-curtain.right{right:0}

/* Generator由来の開始演出 */
.nopera-start-experience{
  position:fixed;inset:0;z-index:90;overflow:hidden;background:#050608;
}
.nopera-start-scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.nopera-start-copy{
  position:relative;z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;
  max-width:86%;text-align:center;pointer-events:none
}
.nopera-start-title{max-width:100%;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.nopera-start-subtitle{font-size:clamp(14px,2.3vw,20px);line-height:1.5}
.nopera-start-credits{display:grid;gap:3px;margin-top:8px;font-size:13px;line-height:1.5}
.nopera-start-book{perspective:1500px;background:radial-gradient(circle at 50% 40%,#202633 0,#090b10 58%,#020203 100%)}
.nopera-start-book-wrap{position:relative;width:min(86%,760px);aspect-ratio:8/5;perspective:1500px;transform:translateX(-25%);transition:transform 1.55s cubic-bezier(.55,.08,.28,.96)}
.nopera-start-book-pages{position:absolute;top:0;right:0;width:50%;height:100%;border-radius:5px 10px 10px 5px;background:#eee7d6;box-shadow:0 20px 45px rgba(0,0,0,.5);transform-style:preserve-3d}
.nopera-start-book-inside{position:absolute;inset:8px 8px 8px 12px;display:grid;place-content:center;gap:8px;border:1px solid #c8bea9;border-radius:4px;color:#312d26;background:linear-gradient(90deg,#d8cfbd 0,#f4eedf 8%,#f8f2e5 100%);text-align:center}
.nopera-start-book-cover{position:absolute;inset:0;z-index:4;border-radius:5px 10px 10px 5px;transform-origin:0 50%;transform-style:preserve-3d;background:transparent;box-shadow:8px 8px 20px rgba(0,0,0,.32)}
.nopera-start-book-face{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;border-radius:inherit;backface-visibility:hidden;background:var(--nopera-book-cover-color,#173f35)}
.nopera-start-book-front{transform:rotateY(0deg);box-shadow:inset -12px 0 22px rgba(0,0,0,.18)}
.nopera-start-book-back{transform:rotateY(180deg);box-shadow:inset 12px 0 22px rgba(0,0,0,.22)}
.nopera-start-book-inner-border{position:absolute;inset:18px;border:1px solid rgba(214,184,95,.52);border-radius:4px}
.nopera-start-book-border{position:absolute;inset:18px;border:2px solid #d6b85f;border-radius:4px;pointer-events:none}
.book-frame-single .nopera-start-book-border,.book-frame-double .nopera-start-book-border,.book-frame-classic .nopera-start-book-border,.book-frame-arched .nopera-start-book-border,.book-frame-geometric .nopera-start-book-border,.book-frame-japanese .nopera-start-book-border{border-color:transparent!important}
.nopera-start-book.is-opening .nopera-start-book-wrap{transform:translateX(0)}
.nopera-start-book.is-opening .nopera-start-book-cover{animation:noperaBookOpen 1.65s cubic-bezier(.55,.08,.28,.96) forwards}
@keyframes noperaBookOpen{0%{transform:rotateY(0deg)}100%{transform:rotateY(-158deg)}}
.nopera-start-opera{background:#080604}
.nopera-start-opera-light{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(255,225,157,.38) 0,rgba(115,73,37,.16) 35%,transparent 66%)}
.nopera-start-opera-curtain{position:absolute;top:0;bottom:0;z-index:5;width:52%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 13px,rgba(0,0,0,.18) 13px 28px),var(--nopera-start-curtain,#741c28);border-bottom:5px solid #d6b85f;box-shadow:0 0 26px rgba(0,0,0,.5)}
.nopera-start-opera-curtain.left{left:0}.nopera-start-opera-curtain.right{right:0}
.nopera-start-opera-valance{position:absolute;top:0;left:0;right:0;z-index:7;height:22%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 18px,rgba(0,0,0,.15) 18px 38px),var(--nopera-start-curtain,#741c28);border-bottom:5px solid #d6b85f;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.nopera-start-opera-copy{color:#f8e7b0;transition:opacity .55s ease}
.nopera-start-opera.is-opening .nopera-start-opera-curtain.left{animation:noperaCurtainLeft 1.7s cubic-bezier(.45,.05,.2,1) forwards}
.nopera-start-opera.is-opening .nopera-start-opera-curtain.right{animation:noperaCurtainRight 1.7s cubic-bezier(.45,.05,.2,1) forwards}
.nopera-start-opera.is-opening .nopera-start-opera-valance{animation:noperaValanceUp 1.7s cubic-bezier(.45,.05,.2,1) forwards}
.nopera-start-opera.is-opening .nopera-start-opera-copy{opacity:0}
@keyframes noperaCurtainLeft{to{transform:translateX(-94%)}}@keyframes noperaCurtainRight{to{transform:translateX(94%)}}@keyframes noperaValanceUp{to{transform:translateY(-92%)}}
.nopera-start-experience.is-finishing{animation:noperaStartFade .5s ease forwards}@keyframes noperaStartFade{to{opacity:0}}
.nopera-start-opera.opera-style-grand .nopera-start-opera-curtain,.nopera-start-opera.opera-style-grand .nopera-start-opera-valance{background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 10px,rgba(0,0,0,.22) 10px 24px),var(--nopera-start-curtain,#741c28);border-bottom-width:7px;box-shadow:inset 0 0 26px rgba(0,0,0,.38),0 8px 24px rgba(0,0,0,.42)}
.nopera-start-opera.opera-style-soft .nopera-start-opera-curtain,.nopera-start-opera.opera-style-soft .nopera-start-opera-valance{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 19px,rgba(0,0,0,.11) 19px 40px),var(--nopera-start-curtain,#741c28);border-bottom-width:3px;filter:saturate(.82) brightness(1.08)}
.nopera-start-opera.opera-style-dark .nopera-start-opera-curtain,.nopera-start-opera.opera-style-dark .nopera-start-opera-valance{background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.34)),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 12px,rgba(0,0,0,.24) 12px 28px),var(--nopera-start-curtain,#741c28);border-bottom-color:rgba(214,184,95,.58)!important}
.nopera-start-opera.opera-style-modern .nopera-start-opera-curtain,.nopera-start-opera.opera-style-modern .nopera-start-opera-valance{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(0,0,0,.09)),var(--nopera-start-curtain,#741c28);border-bottom-width:2px;box-shadow:none}
.nopera-start-opera.opera-style-modern .nopera-start-opera-valance{height:15%}
@media(max-width:640px){
  .nopera-cover-stage{width:94vw;height:82vh;min-height:360px;padding:34px 22px}
  .nopera-start-book-wrap{width:min(78%,330px)}
}
@media(prefers-reduced-motion:reduce){
  .nopera-start-book.is-opening .nopera-start-book-cover,
  .nopera-start-opera.is-opening .nopera-start-opera-curtain.left,
  .nopera-start-opera.is-opening .nopera-start-opera-curtain.right,
  .nopera-start-opera.is-opening .nopera-start-opera-valance,
  .nopera-start-experience.is-finishing{animation-duration:.01ms!important}
}


    .toc-cover-item{
      font-weight:800;
      margin-bottom:8px;
      border-bottom:1px solid #ddd4c6;
    }


/* Public output: prototype-only controls remain inert and hidden. */
.prototype-badge,.prototype-page-nav,.prototype-loader{display:none!important}
</style>
</head>
<body>
<div class="reader-shell">
  <header class="reader-topbar">
